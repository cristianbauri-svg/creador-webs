<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D8A3F" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#iconGlow)">
    <!-- Pantalla -->
    <rect x="7" y="6" width="34" height="22" rx="3" fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>
    <!-- Botón play -->
    <polygon points="18,12 18,22 28,17" fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Soporte -->
    <line x1="24" y1="28" x2="24" y2="34" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Base -->
    <line x1="16" y1="36" x2="32" y2="36" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
