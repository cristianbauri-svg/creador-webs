<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D8A3F" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#iconGlow)">
    <!-- Diadema -->
    <path d="M6 16 C6 6 18 2 24 2 C30 2 42 6 42 16" fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Auricular izquierdo -->
    <rect x="4" y="14" width="12" height="18" rx="5" fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>
    <!-- Auricular derecho -->
    <rect x="32" y="14" width="12" height="18" rx="5" fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>
    <!-- Brazo micrófono (sale del auricular derecho hacia afuera) -->
    <path d="M44 24 L44 32 Q44 40 38 40" fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cápsula del micrófono -->
    <ellipse cx="35" cy="40" rx="3" ry="5" fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>
  </g>
</svg>
