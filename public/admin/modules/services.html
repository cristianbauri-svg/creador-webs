<!-- Services Module — CRUD completo -->
<div class="card" id="servicesToolbar">
  <div class="card-header">
    <h3 class="card-title">🔧 Servicios</h3>
    <button class="btn-admin btn-primary-admin" id="btnAddService">+ Agregar Servicio</button>
  </div>
</div>

<div class="card" id="servicesTableCard">
  <div class="table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th>Título</th>
          <th>Estado</th>
          <th>Orden</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="servicesTbody">
        <tr><td colspan="4"><div class="loading-admin">Cargando servicios...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="card" id="servicesFormCard" style="display:none;">
  <div class="card-header">
    <h3 class="card-title" id="servicesFormTitle">Nuevo Servicio</h3>
  </div>
  <form id="servicesForm" autocomplete="off">
    <input type="hidden" id="svcId" />
    <div class="form-row-admin">
      <div class="form-group-admin">
        <label class="form-label-admin" for="svcTitle">Título *</label>
        <input class="form-input-admin" id="svcTitle" required maxlength="200" placeholder="Ej: Sonido en Vivo" />
      </div>
      <div class="form-group-admin">
        <label class="form-label-admin" for="svcIcon">Ícono (emoji o texto corto)</label>
        <input class="form-input-admin" id="svcIcon" maxlength="10" placeholder="Ej: 🔊" />
      </div>
    </div>
    <div class="form-row-admin">
      <div class="form-group-admin">
        <label class="form-label-admin">URL de imagen</label>
        <div id="svcImageDrop" style="border:2px dashed var(--color-border);border-radius:var(--radius);padding:1.5rem;text-align:center;cursor:pointer;transition:border-color 200ms ease;min-height:100px;display:flex;align-items:center;justify-content:center;">
          <div id="svcImageDropMsg" style="color:var(--color-text-muted);font-size:0.8125rem;">Arrastra una imagen aquí o haz clic para seleccionar</div>
        </div>
        <input type="file" id="svcImageFile" hidden accept="image/webp,image/jpeg,image/png" />
        <small style="color:var(--color-text-muted);font-size:0.7rem;display:block;margin-top:0.35rem;">Formatos aceptados: WebP (recomendado), JPEG, PNG. Tamaño máximo: 5 MB.</small>
      </div>
      <div class="form-group-admin">
        <label class="form-label-admin" for="svcSortOrder">Orden</label>
        <input class="form-input-admin" id="svcSortOrder" type="number" value="0" min="0" />
      </div>
    </div>
    <div class="form-row-admin">
      <div class="form-group-admin">
        <label class="form-label-admin" for="svcStatus">Estado</label>
        <select class="form-select-admin" id="svcStatus">
          <option value="draft">Borrador</option>
          <option value="published">Publicado</option>
        </select>
      </div>
      <div class="form-group-admin"></div>
    </div>
    <div class="form-group-admin">
      <label class="form-label-admin" for="svcDescription">Descripción</label>
      <textarea class="form-textarea-admin" id="svcDescription" rows="3" placeholder="Descripción del servicio..."></textarea>
    </div>
    <div class="form-group-admin">
      <label class="form-label-admin">Características</label>
      <div id="featuresList"></div>
      <button type="button" class="btn-admin btn-ghost-admin" id="btnAddFeature" style="margin-top:0.5rem;font-size:0.75rem;">+ Agregar otra característica</button>
    </div>
    <div class="form-actions">
      <button type="button" class="btn-admin btn-ghost-admin" id="btnCancelService">Cancelar</button>
      <button type="submit" class="btn-admin btn-primary-admin">Guardar</button>
    </div>
  </form>
</div>

<script>
(function () {
  'use strict';

  var currentId = null;
  var svcImageFile = null;
  var existingImageUrl = '';

  var els = {
    tbody: document.getElementById('servicesTbody'),
    formCard: document.getElementById('servicesFormCard'),
    formTitle: document.getElementById('servicesFormTitle'),
    form: document.getElementById('servicesForm'),
    svcId: document.getElementById('svcId'),
    svcTitle: document.getElementById('svcTitle'),
    svcIcon: document.getElementById('svcIcon'),
    svcImageDrop: document.getElementById('svcImageDrop'),
    svcImageDropMsg: document.getElementById('svcImageDropMsg'),
    svcImageFile: document.getElementById('svcImageFile'),
    svcSortOrder: document.getElementById('svcSortOrder'),
    svcStatus: document.getElementById('svcStatus'),
    svcDescription: document.getElementById('svcDescription'),
    featuresList: document.getElementById('featuresList'),
    btnAddFeature: document.getElementById('btnAddFeature'),
    btnAdd: document.getElementById('btnAddService'),
    btnCancel: document.getElementById('btnCancelService'),
  };

  loadServices();

  els.btnAdd.addEventListener('click', function () { showForm(); });
  els.btnCancel.addEventListener('click', function () { hideForm(); });
  els.btnAddFeature.addEventListener('click', function () { addFeatureInput(''); });
  els.form.addEventListener('submit', function (e) { e.preventDefault(); saveService(); });

  // Drag & drop — Imagen del servicio
  initDropZone(els.svcImageDrop, els.svcImageFile, function (file) {
    svcImageFile = file;
    showImagePreview(file, els.svcImageDrop);
  });
  els.svcImageDrop.addEventListener('click', function () { els.svcImageFile.click(); });
  els.svcImageFile.addEventListener('change', function () {
    if (els.svcImageFile.files && els.svcImageFile.files[0]) {
      svcImageFile = els.svcImageFile.files[0];
      showImagePreview(svcImageFile, els.svcImageDrop);
    }
  });

  function loadServices() {
    fetch('/api/services')
      .then(function (r) { return r.json(); })
      .then(renderTable)
      .catch(function (err) {
        console.error('Error cargando servicios:', err);
        els.tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state-admin"><p>Error al cargar servicios</p></div></td></tr>';
      });
  }

  function renderTable(rows) {
    if (!Array.isArray(rows) || rows.length === 0) {
      els.tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state-admin"><div class="empty-state-admin-icon">🔧</div><p>No hay servicios registrados</p></div></td></tr>';
      return;
    }

    els.tbody.innerHTML = rows.map(function (s) {
      var badgeClass = s.status === 'published' ? 'published' : 'draft';
      var badgeText = s.status === 'published' ? 'Publicado' : 'Borrador';
      var icon = s.icon ? '<span style="margin-right:0.4rem;">' + esc(s.icon) + '</span>' : '';

      return '<tr>' +
        '<td>' + icon + '<strong>' + esc(s.title) + '</strong></td>' +
        '<td><span class="status-badge ' + badgeClass + '">' + badgeText + '</span></td>' +
        '<td>' + (s.sort_order || 0) + '</td>' +
        '<td>' +
          '<button class="btn-admin btn-ghost-admin btnEditService" data-id="' + s.id + '" style="padding:0.25rem 0.5rem;font-size:0.75rem;">✏️</button> ' +
          '<button class="btn-admin btn-danger-admin btnDelService" data-id="' + s.id + '" style="padding:0.25rem 0.5rem;font-size:0.75rem;">🗑️</button>' +
        '</td>' +
        '</tr>';
    }).join('');

    bindEditButtons(els.tbody.querySelectorAll('.btnEditService'), editService);
    bindDeleteButtons(els.tbody.querySelectorAll('.btnDelService'), deleteService);
  }

  function showForm(service) {
    currentId = service ? service.id : null;
    els.formTitle.textContent = service ? 'Editar Servicio' : 'Nuevo Servicio';
    els.svcId.value = service ? service.id : '';
    els.svcTitle.value = service ? (service.title || '') : '';
    els.svcIcon.value = service ? (service.icon || '') : '';
    els.svcSortOrder.value = service ? (service.sort_order || 0) : 0;
    els.svcStatus.value = service ? (service.status || 'draft') : 'draft';
    els.svcDescription.value = service ? (service.description || '') : '';

    // Resetear estado de archivos
    svcImageFile = null;
    existingImageUrl = service ? (service.image_url || '') : '';

    if (existingImageUrl) {
      showImagePreview(existingImageUrl, els.svcImageDrop);
    } else {
      resetImageDrop(els.svcImageDrop, els.svcImageDropMsg);
    }

    // Construir lista de características dinámica
    var features = [];
    if (service && service.features) {
      features = service.features.split('\n').filter(function (f) { return f.trim() !== ''; });
    }
    buildFeaturesList(features);

    els.formCard.style.display = '';
  }

  function hideForm() {
    els.formCard.style.display = 'none';
    els.form.reset();
    resetImageDrop(els.svcImageDrop, els.svcImageDropMsg);
    els.featuresList.innerHTML = '';
    svcImageFile = null;
    existingImageUrl = '';
    currentId = null;
  }

  function saveService() {
    var title = els.svcTitle.value.trim();

    if (!title) {
      alert('El título del servicio es obligatorio.');
      return;
    }

    var submitBtn = els.form.querySelector('button[type="submit"]');
    var originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Subiendo imagen...';

    var imagePromise;
    if (svcImageFile) {
      imagePromise = uploadFile(svcImageFile).then(function (result) { return result.url; });
    } else {
      imagePromise = Promise.resolve(existingImageUrl || null);
    }

    imagePromise.then(function (imageUrl) {
      var body = {
        title: title,
        icon: els.svcIcon.value.trim() || null,
        image_url: imageUrl,
        sort_order: parseInt(els.svcSortOrder.value, 10) || 0,
        status: els.svcStatus.value,
        description: els.svcDescription.value.trim() || null,
        features: collectFeatures(),
      };

      var url = currentId ? '/api/services/' + currentId : '/api/services';
      var method = currentId ? 'PUT' : 'POST';

      return fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (err) { throw new Error(err.error || 'Error del servidor'); });
        return r.json();
      });
    })
      .then(function () {
        hideForm();
        loadServices();
        var btn = document.querySelector('#servicesForm button[type="submit"]');
        if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; }
      })
      .catch(function (err) {
        alert('Error: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      });
  }

  function editService(id) {
    fetch('/api/services/' + id)
      .then(function (r) { return r.json(); })
      .then(function (service) { showForm(service); })
      .catch(function (err) { alert('Error al cargar servicio: ' + err.message); });
  }

  function deleteService(id) {
    if (!confirm('¿Eliminar este servicio? Esta acción no se puede deshacer.')) return;
    fetch('/api/services/' + id, { method: 'DELETE' })
      .then(function (r) {
        if (!r.ok) throw new Error('Error del servidor');
        return r.json();
      })
      .then(function () { loadServices(); })
      .catch(function (err) { alert('Error: ' + err.message); });
  }

  function bindEditButtons(btns, handler) {
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { handler(parseInt(this.dataset.id, 10)); });
    }
  }

  function bindDeleteButtons(btns, handler) {
    for (var j = 0; j < btns.length; j++) {
      btns[j].addEventListener('click', function () { handler(parseInt(this.dataset.id, 10)); });
    }
  }

  function esc(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function initDropZone(dropEl, fileInput, onFiles) {
    dropEl.addEventListener('dragover', function (e) { e.preventDefault(); dropEl.style.borderColor = 'var(--color-accent)'; });
    dropEl.addEventListener('dragleave', function () { dropEl.style.borderColor = 'var(--color-border)'; });
    dropEl.addEventListener('drop', function (e) {
      e.preventDefault();
      dropEl.style.borderColor = 'var(--color-border)';
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        onFiles(e.dataTransfer.files[0]);
      }
    });
  }

  function showImagePreview(src, dropEl) {
    var isUrl = typeof src === 'string';
    var imgSrc = isUrl ? src : URL.createObjectURL(src);
    var msgEl = dropEl.querySelector('[id$="DropMsg"]');
    if (msgEl) msgEl.style.display = 'none';

    var oldPreview = dropEl.querySelector('img');
    if (oldPreview) oldPreview.remove();

    var img = document.createElement('img');
    img.src = imgSrc;
    img.style.cssText = 'max-width:100%;max-height:200px;border-radius:4px;object-fit:cover;';
    dropEl.style.padding = '0.5rem';
    dropEl.appendChild(img);
  }

  function resetImageDrop(dropEl, msgEl) {
    var oldImg = dropEl.querySelector('img');
    if (oldImg) oldImg.remove();
    dropEl.style.padding = '1.5rem';
    msgEl.style.display = '';
  }

  function uploadFile(file) {
    var formData = new FormData();
    formData.append('file', file);

    return fetch('/api/upload', {
      method: 'POST',
      body: formData,
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (err) { throw new Error(err.error || 'Error al subir imagen'); });
      return r.json();
    });
  }

  // --- Lista dinámica de características ---

  function buildFeaturesList(items) {
    els.featuresList.innerHTML = '';
    if (!items || items.length === 0) {
      addFeatureInput('');
    } else {
      for (var i = 0; i < items.length; i++) {
        addFeatureInput(items[i]);
      }
    }
  }

  function addFeatureInput(value) {
    var row = document.createElement('div');
    row.className = 'feature-row';
    row.style.cssText = 'display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;';

    var bullet = document.createElement('span');
    bullet.textContent = '•';
    bullet.style.cssText = 'color:var(--color-accent);font-weight:700;font-size:1.2rem;flex-shrink:0;';

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'form-input-admin';
    input.placeholder = 'Ej: Sonido envolvente 360°';
    input.value = value || '';
    input.style.cssText = 'flex:1;';

    var delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.textContent = '✕';
    delBtn.style.cssText = 'flex-shrink:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:none;background:transparent;color:var(--color-text-muted);cursor:pointer;font-size:0.875rem;transition:all 200ms ease;';
    delBtn.addEventListener('mouseenter', function () { delBtn.style.color = 'var(--color-danger)'; delBtn.style.background = 'rgba(229,62,62,0.1)'; });
    delBtn.addEventListener('mouseleave', function () { delBtn.style.color = 'var(--color-text-muted)'; delBtn.style.background = 'transparent'; });
    delBtn.addEventListener('click', function () { removeFeatureInput(row); });

    row.appendChild(bullet);
    row.appendChild(input);
    row.appendChild(delBtn);
    els.featuresList.appendChild(row);

    updateFeatureRemoveButtons();
  }

  function removeFeatureInput(row) {
    var rows = els.featuresList.querySelectorAll('.feature-row');
    if (rows.length <= 1) {
      alert('Al menos una característica es obligatoria.');
      return;
    }
    row.remove();
    updateFeatureRemoveButtons();
  }

  function updateFeatureRemoveButtons() {
    var rows = els.featuresList.querySelectorAll('.feature-row');
    for (var i = 0; i < rows.length; i++) {
      var btn = rows[i].querySelector('button');
      if (rows.length === 1) {
        btn.style.display = 'none';
      } else {
        btn.style.display = '';
      }
    }
  }

  function collectFeatures() {
    var inputs = els.featuresList.querySelectorAll('.feature-row input');
    var items = [];
    for (var i = 0; i < inputs.length; i++) {
      var val = inputs[i].value.trim();
      if (val) items.push(val);
    }
    return items.length > 0 ? items.join('\n') : null;
  }

})();
</script>
