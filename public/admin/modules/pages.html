  // Categorías de productos disponibles, para el select del carrusel dinámico
  var PRODUCT_CATEGORIES = [];
  function loadProductCategories() {
    fetch('/api/products?per_page=100')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var items = Array.isArray(data) ? data : (data.products || []);
        var set = {};
        items.forEach(function(p) { if (p.category) set[p.category] = true; });
        PRODUCT_CATEGORIES = Object.keys(set).sort();
        renderBlocks();
      })
      .catch(function() { PRODUCT_CATEGORIES = []; });
  }

  // Construye el sub-editor de un prop de tipo array (cards/images/testimonials)
  function buildArrayEditor(blockIndex, prop) {
    var def = ARRAY_FIELD_DEFS[prop];
    var wrap = document.createElement('div');
    wrap.className = 'array-editor';

    var itemsList = document.createElement('div');
    itemsList.className = 'array-editor-list';

    function renderItems() {
      itemsList.innerHTML = '';
      if (!Array.isArray(blocks[blockIndex].props[prop])) blocks[blockIndex].props[prop] = [];
      var arr = blocks[blockIndex].props[prop];
      if (arr.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'array-editor-empty';
        empty.textContent = 'Sin elementos. Usa el botón de abajo para añadir uno.';
        itemsList.appendChild(empty);
        return;
      }
      arr.forEach(function(item, itemIdx) {
        var itemEl = document.createElement('div');
        itemEl.className = 'array-editor-item';

        var itemHeader = document.createElement('div');
        itemHeader.className = 'array-editor-item-header';
        var itemTitle = document.createElement('span');
        itemTitle.textContent = '#' + (itemIdx + 1);
        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'array-editor-remove';
        delBtn.title = 'Eliminar';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', function() {
          blocks[blockIndex].props[prop].splice(itemIdx, 1);
          renderItems();
        });
        itemHeader.appendChild(itemTitle);
        itemHeader.appendChild(delBtn);
        itemEl.appendChild(itemHeader);

        def.items.forEach(function(field) {
          // Detectar campos de imagen (cards: "image", gallery: "url")
          // para usar file upload con preview en vez de input de texto
          var isImageField = (prop === 'cards' && field === 'image') || (prop === 'images' && field === 'url');

          var fLabel = document.createElement('label');
          fLabel.textContent = def.labels[field] || field;
          itemEl.appendChild(fLabel);

          if (isImageField) {
            // --- File upload con preview ---
            var preview = document.createElement('img');
            var hasExisting = item[field] && typeof item[field] === 'string';
            preview.style.cssText = 'max-width:100%;max-height:120px;border-radius:6px;object-fit:cover;margin-bottom:6px;display:' + (hasExisting ? 'block' : 'none') + ';';
            if (hasExisting) preview.src = item[field];
            itemEl.appendChild(preview);

            var fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/png,image/jpeg,image/webp';
            fileInput.addEventListener('change', (function(it, f, previewEl) {
              return function() {
                var file = this.files && this.files[0];
                if (!file) return;
                it[f] = file; // File object, se sube al guardar
                var reader = new FileReader();
                reader.onload = function(e) {
                  previewEl.src = e.target.result;
                  previewEl.style.display = 'block';
                };
                reader.readAsDataURL(file);
              };
            })(item, field, preview));
            itemEl.appendChild(fileInput);

            if (hasExisting) {
              var clearBtn = document.createElement('button');
              clearBtn.type = 'button';
              clearBtn.textContent = 'Quitar foto';
              clearBtn.style.cssText = 'background:none;border:1px solid #2a2a2a;color:#aaa;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:11px;margin-top:4px;align-self:flex-start;';
              clearBtn.addEventListener('click', function() {
                item[field] = '';
                preview.style.display = 'none';
                preview.src = '';
                fileInput.value = '';
              });
              itemEl.appendChild(clearBtn);
            }
          } else if (field === 'description' || field === 'text') {
            var fInput = document.createElement('textarea');
            fInput.value = item[field] || '';
            fInput.addEventListener('input', (function(it, f, inp) {
              return function() { it[f] = inp.value; };
            })(item, field, fInput));
            itemEl.appendChild(fInput);
          } else {
            var fInput = document.createElement('input');
            fInput.value = item[field] || '';
            fInput.addEventListener('input', (function(it, f, inp) {
              return function() { it[f] = inp.value; };
            })(item, field, fInput));
            itemEl.appendChild(fInput);
          }
        });

        itemsList.appendChild(itemEl);
      });
    }

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'array-editor-add';
    addBtn.textContent = def.addLabel;
    addBtn.addEventListener('click', function() {
      if (!Array.isArray(blocks[blockIndex].props[prop])) blocks[blockIndex].props[prop] = [];
      var newItem = {};
      def.items.forEach(function(f) { newItem[f] = ''; });
      blocks[blockIndex].props[prop].push(newItem);
      renderItems();
    });

    renderItems();
    wrap.appendChild(itemsList);
    wrap.appendChild(addBtn);
    return wrap;
  }

  // Sub-editor de slides del carrusel de productos en modo manual. A
  // diferencia de buildArrayEditor, el campo de imagen es un input file con
  // miniatura de preview (FileReader) en vez de un texto de URL: el usuario
  // sube su propia imagen en vez de escoger de productos existentes.
  function buildSlidesEditor(blockIndex) {
    var wrap = document.createElement('div');
    wrap.className = 'array-editor';

    var itemsList = document.createElement('div');
    itemsList.className = 'array-editor-list';

    function renderItems() {
      itemsList.innerHTML = '';
      if (!Array.isArray(blocks[blockIndex].props.slides)) blocks[blockIndex].props.slides = [];
      var arr = blocks[blockIndex].props.slides;
      if (arr.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'array-editor-empty';
        empty.textContent = 'Sin slides. Usa el botón de abajo para añadir uno.';
        itemsList.appendChild(empty);
        return;
      }
      arr.forEach(function(item, itemIdx) {
        var itemEl = document.createElement('div');
        itemEl.className = 'array-editor-item';

        var itemHeader = document.createElement('div');
        itemHeader.className = 'array-editor-item-header';
        var itemTitle = document.createElement('span');
        itemTitle.textContent = '#' + (itemIdx + 1);
        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'array-editor-remove';
        delBtn.title = 'Eliminar';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', function() {
          blocks[blockIndex].props.slides.splice(itemIdx, 1);
          renderItems();
        });
        itemHeader.appendChild(itemTitle);
        itemHeader.appendChild(delBtn);
        itemEl.appendChild(itemHeader);

        // Imagen: preview + input file
        var imgLabel = document.createElement('label');
        imgLabel.textContent = 'Imagen';
        itemEl.appendChild(imgLabel);

        var preview = document.createElement('img');
        var hasExistingUrl = item.image && typeof item.image === 'string';
        preview.style.cssText = 'max-width:100%;max-height:140px;border-radius:6px;object-fit:cover;margin-bottom:6px;display:' + (hasExistingUrl ? 'block' : 'none') + ';';
        if (hasExistingUrl) preview.src = item.image;
        itemEl.appendChild(preview);

        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/png,image/jpeg,image/webp';
        fileInput.addEventListener('change', (function(it, previewEl) {
          return function() {
            var file = this.files && this.files[0];
            if (!file) return;
            it.image = file; // se sube a /api/upload recién al guardar
            var reader = new FileReader();
            reader.onload = function(e) {
              previewEl.src = e.target.result;
              previewEl.style.display = 'block';
            };
            reader.readAsDataURL(file);
          };
        })(item, preview));
        itemEl.appendChild(fileInput);

        // Título
        var titleLabel = document.createElement('label');
        titleLabel.textContent = 'Título';
        itemEl.appendChild(titleLabel);
        var titleInput = document.createElement('input');
        titleInput.value = item.title || '';
        titleInput.addEventListener('input', (function(it, inp) { return function() { it.title = inp.value; }; })(item, titleInput));
        itemEl.appendChild(titleInput);

        // Descripción
        var descLabel = document.createElement('label');
        descLabel.textContent = 'Descripción';
        itemEl.appendChild(descLabel);
        var descInput = document.createElement('textarea');
        descInput.value = item.description || '';
        descInput.addEventListener('input', (function(it, inp) { return function() { it.description = inp.value; }; })(item, descInput));
        itemEl.appendChild(descInput);

        // Link
        var linkLabel = document.createElement('label');
        linkLabel.textContent = 'Link (opcional)';
        itemEl.appendChild(linkLabel);
        var linkInput = document.createElement('input');
        linkInput.value = item.link || '';
        linkInput.addEventListener('input', (function(it, inp) { return function() { it.link = inp.value; }; })(item, linkInput));
        itemEl.appendChild(linkInput);

        itemsList.appendChild(itemEl);
      });
    }

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'array-editor-add';
    addBtn.textContent = '+ Añadir Slide';
    addBtn.addEventListener('click', function() {
      if (!Array.isArray(blocks[blockIndex].props.slides)) blocks[blockIndex].props.slides = [];
      blocks[blockIndex].props.slides.push({ image: '', title: '', description: '', link: '' });
      renderItems();
    });

    renderItems();
    wrap.appendChild(itemsList);
    wrap.appendChild(addBtn);
    return wrap;
  }

  // Construir paleta de bloques
  function buildPalette() {
    els.palette.innerHTML = '';
    BLOCK_TYPES.forEach(function(bt) {
      var item = document.createElement('div');
      item.className = 'palette-item';
      item.innerHTML = '<div class="block-thumb">' + bt.thumb + '</div><div class="palette-label">' + bt.icon + ' ' + bt.label + '</div><div class="palette-desc">' + bt.desc + '</div>';
      item.addEventListener('click', function() { addBlock(bt.type); });
      els.palette.appendChild(item);
    });
  }

  // Añadir bloque al array
  function addBlock(type) {
    var def = BLOCK_TYPES.find(function(b) { return b.type === type; });
    if (!def) return;
    var newBlock = { type: type, props: {} };
    def.props.forEach(function(p) { newBlock.props[p] = ''; });
    if (type === 'cards') newBlock.props.cards = [];
    if (type === 'gallery') newBlock.props.images = [];
    if (type === 'testimonials') newBlock.props.testimonials = [];
    if (type === 'faq') newBlock.props.faqs = [];
    if (type === 'product-carousel') { newBlock.props.mode = 'category'; newBlock.props.slides = []; }
    // Ojos de los slots de imagen: nacen abiertos para que un bloque nuevo se
    // comporte igual que siempre (la imagen se ve en ambos dispositivos) hasta
    // que el admin los cierre a propósito.
    if (type === 'hero' || type === 'image') {
      var prefix = type === 'hero' ? 'bg_url' : 'url';
      newBlock.props[prefix + '_visible_desktop'] = true;
      newBlock.props[prefix + '_visible_mobile'] = true;
      newBlock.props[prefix + '_mobile_visible_desktop'] = true;
      newBlock.props[prefix + '_mobile_visible_mobile'] = true;
    }
    if (type === 'whatsapp') {
      newBlock.props.phone = '';
      newBlock.props.message = 'Hola, quiero solicitar una cotización';
    }
    blocks.push(newBlock);
    renderBlocks();
    expandBlock(blocks.length - 1); // auto-expandir el recién añadido
    // Precargar el número de WhatsApp desde settings (async, no bloquea el render)
    if (type === 'whatsapp') {
      fetch('/api/settings')
        .then(function(r) { return r.json(); })
        .then(function(settings) {
          var phone = (settings && settings.whatsapp_number) ? settings.whatsapp_number.replace(/[^0-9]/g, '') : '';
          if (phone && blocks[blocks.length - 1] && blocks[blocks.length - 1].type === 'whatsapp' && !blocks[blocks.length - 1].props.phone) {
            blocks[blocks.length - 1].props.phone = phone;
            renderBlocks();
          }
        })
        .catch(function() { /* ignorar — el admin ingresa el número manualmente */ });
    }
  }

  // Eliminar bloque
  function removeBlock(index) {
    blocks.splice(index, 1);
    renderBlocks();
  }

  // Mover bloque
  function moveBlock(index, dir) {
    var newIdx = index + dir;
    if (newIdx < 0 || newIdx >= blocks.length) return;
    var temp = blocks[index];
    blocks[index] = blocks[newIdx];
    blocks[newIdx] = temp;
    renderBlocks();
  }

  // Expandir/colapsar bloque
  function toggleBlock(index) {
    var blockEls = els.blockList.querySelectorAll('.editor-block');
    if (blockEls[index]) blockEls[index].classList.toggle('expanded');
  }

  function expandBlock(index) {
    var blockEls = els.blockList.querySelectorAll('.editor-block');
    if (blockEls[index]) blockEls[index].classList.add('expanded');
  }

  // ===== Slots de imagen responsive (bloques Hero e Imagen) =====
  // Cada bloque con imagen tiene dos slots: Horizontal (para desktop) y
  // Vertical (para móvil). Cada slot lleva DOS ojos que deciden en qué
  // dispositivos se ve esa imagen. La resolución final la hacen
  // resolveSlotImages() en public/js/app.js y su espejo en src/index.ts:
  // desktop prefiere el slot Horizontal, móvil el Vertical, y si el preferido
  // está oculto o vacío cae al otro.
  var EYE_ICON_OPEN = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_ICON_CLOSED = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  // Previews (dataURL) de archivos elegidos pero todavía no subidos, indexados
  // por el propio objeto File. Al re-renderizar el cuerpo del bloque (por
  // ejemplo al pulsar un ojo) el File sigue en props pero su vista previa se
  // perdería; esto la conserva. Es un WeakMap, así que no fuga memoria y no
  // se serializa nunca a content_json.
  var pendingPreviews = new WeakMap();

  /** Botón de ojo: alterna si la imagen del slot se ve en `deviceLabel`. */
  function buildEyeToggle(idx, block, def, visibleProp, deviceLabel) {
    var isOpen = block.props[visibleProp] !== false;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'eye-toggle ' + (isOpen ? 'is-open' : 'is-closed');
    btn.innerHTML = (isOpen ? EYE_ICON_OPEN : EYE_ICON_CLOSED) + '<span>' + deviceLabel + '</span>';
    btn.title = isOpen
      ? 'Visible en ' + deviceLabel + '. Clic para ocultarlo ahí.'
      : 'Oculto en ' + deviceLabel + '. Clic para mostrarlo ahí.';
    btn.addEventListener('click', function() {
      blocks[idx].props[visibleProp] = !isOpen;
      _hasUnsavedChanges = true;
      // Re-render solo de este cuerpo, para no perder el estado expandido
      // de los demás bloques.
      fillBlockBody(btn.closest('.block-body'), idx, blocks[idx], def);
    });
    return btn;
  }

  /** Un slot de imagen: encabezado con sus dos ojos, vista previa, selector
   *  de archivo, botón para quitarla y una nota de tamaño recomendado. */
  function buildImageSlot(idx, block, def, cfg) {
    var wrap = document.createElement('div');
    wrap.className = 'img-slot';

    var head = document.createElement('div');
    head.className = 'img-slot-head';

    var name = document.createElement('span');
    name.className = 'img-slot-name';
    name.textContent = cfg.label;
    head.appendChild(name);

    var eyes = document.createElement('div');
    eyes.className = 'img-slot-eyes';
    eyes.appendChild(buildEyeToggle(idx, block, def, cfg.desktopProp, 'Desktop'));
    eyes.appendChild(buildEyeToggle(idx, block, def, cfg.mobileProp, 'Móvil'));
    head.appendChild(eyes);
    wrap.appendChild(head);

    var current = block.props[cfg.urlProp];
    var existingSrc = (typeof current === 'string' && current)
      ? current
      : (pendingPreviews.get(current) || '');

    var preview = document.createElement('img');
    preview.className = 'img-slot-preview';
    preview.style.display = existingSrc ? 'block' : 'none';
    if (existingSrc) preview.src = existingSrc;
    wrap.appendChild(preview);

    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/png,image/jpeg,image/webp';
    fileInput.addEventListener('change', function() {
      var file = this.files && this.files[0];
      if (!file) return;
      block.props[cfg.urlProp] = file; // File object: se sube al guardar
      var reader = new FileReader();
      reader.onload = function(e) {
        pendingPreviews.set(file, e.target.result);
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });
    wrap.appendChild(fileInput);

    if (typeof current === 'string' && current) {
      var clearBtn = document.createElement('button');
      clearBtn.type = 'button';
      clearBtn.className = 'img-slot-clear';
      clearBtn.textContent = 'Quitar foto';
      clearBtn.addEventListener('click', function() {
        block.props[cfg.urlProp] = '';
        _hasUnsavedChanges = true;
        preview.style.display = 'none';
        preview.src = '';
        fileInput.value = '';
      });
      wrap.appendChild(clearBtn);
    }

    var hint = document.createElement('small');
    hint.className = 'img-slot-hint';
    hint.textContent = cfg.hint;
    wrap.appendChild(hint);

    return wrap;
  }

  /** Los dos slots (Horizontal / Vertical) de un bloque con imagen.
   *  `variant` es 'hero' o 'image'; solo cambia el prefijo de las props. */
  function buildImageSlotsGroup(idx, block, def, variant) {
    var group = document.createElement('div');
    group.className = 'img-slots';

    var help = document.createElement('small');
    help.className = 'img-slots-help';
    help.textContent = 'Sube una imagen horizontal para desktop y otra vertical para móvil. '
      + 'Los dos ojos de cada slot indican en qué dispositivos se ve esa imagen.';
    group.appendChild(help);

    var isHero = variant === 'hero';
    group.appendChild(buildImageSlot(idx, block, def, {
      label: 'Horizontal — Desktop',
      hint: 'Recomendado 1920×1080 (16:9). Se usa en desktop y sirve de respaldo en móvil.',
      urlProp: isHero ? 'bg_url' : 'url',
      desktopProp: isHero ? 'bg_url_visible_desktop' : 'url_visible_desktop',
      mobileProp: isHero ? 'bg_url_visible_mobile' : 'url_visible_mobile'
    }));
    group.appendChild(buildImageSlot(idx, block, def, {
      label: 'Vertical — Móvil',
      hint: 'Recomendado 1080×1920 (9:16). Si lo dejas vacío, el móvil usa la horizontal.',
      urlProp: isHero ? 'bg_url_mobile' : 'url_mobile',
      desktopProp: isHero ? 'bg_url_mobile_visible_desktop' : 'url_mobile_visible_desktop',
      mobileProp: isHero ? 'bg_url_mobile_visible_mobile' : 'url_mobile_visible_mobile'
    }));

    return group;
  }

  // === Control de fondo: color plano o degradado ===
  //
  // Lo que se guarda sigue siendo exactamente el mismo texto de siempre en
  // bg_color (un color "#rrggbb" o un "linear-gradient(...)"), así que no hay
  // migración ni cambios en el render: solo cambia la forma de escribirlo. El
  // campo de texto libre no desaparece: queda dentro de "Avanzado" para los
  // fondos que este control no sabe armar (degradados radiales, tres colores o
  // valores ya guardados con otra forma), de modo que nada se pierda.

  /** Direcciones del degradado. A la izquierda lo que se lee en el panel; a la
   *  derecha lo que se escribe en el CSS. Ninguna opción menciona términos de
   *  CSS ni nombres de funciones. */
  var DIRECCIONES_FONDO = [
    ['De arriba hacia abajo', 'to bottom'],
    ['De abajo hacia arriba', 'to top'],
    ['De izquierda a derecha', 'to right'],
    ['De derecha a izquierda', 'to left'],
    ['En diagonal ↘', 'to bottom right'],
    ['En diagonal ↙', 'to bottom left']
  ];

  /** Lee un degradado lineal de dos colores: devuelve [dirección, color A,
   *  color B] o null si el valor no tiene esa forma.
   *
   *  Es tolerante a propósito. Un valor escrito a mano puede venir sin el
   *  paréntesis final, sin los porcentajes de las paradas o con espacios de más
   *  (en la página "sonido" hay uno al que le falta el paréntesis), y el
   *  navegador lo perdona; aquí también, para poder mostrarlo en el control en
   *  vez de relegarlo a "Avanzado". Solo acepta colores de seis dígitos, que
   *  son los que produce el selector de color. */
  var RE_FONDO_DEGRADADO = /^\s*linear-gradient\s*\(\s*(?:([a-z ]+?)\s*,\s*)?(#[0-9a-fA-F]{6})\s*(?:[\d.]+%)?\s*,\s*(#[0-9a-fA-F]{6})\s*(?:[\d.]+%)?\s*\)?\s*;?\s*$/;

  /** ¿El navegador aceptaría este valor como fondo? Se prueba en un elemento
   *  suelto: la CSSOM descarta en silencio los valores inválidos, así que si el
   *  valor no queda escrito es que no se aplicaría y el bloque saldría sin
   *  fondo. Es el aviso que hasta ahora no existía en ninguna parte del panel:
   *  un tipo mal escrito se guardaba y el fondo desaparecía sin explicación. */
  function fondoAplicable(valor) {
    if (!valor) return true;
    var prueba = document.createElement('div');
    prueba.style.background = valor;
    return !!prueba.style.background;
  }

  var bgCtrlSeq = 0;

  /** Construye el control de fondo. Devuelve { el, set }:
   *    el  → el nodo que se inserta en el panel
   *    set → carga un valor guardado sin avisar a alCambiar, para que abrir una
   *          página no reescriba nada por sí solo
   *  `alCambiar(nuevoValor)` se llama en cada interacción del usuario, nunca al
   *  construir el control. */
  function crearControlFondo(valorInicial, alCambiar) {
    var modo = 'plano';              // 'plano' | 'degradado'
    var colorPlano = '';             // vacío = sin fondo
    var colorA = '#0a0a0a';
    var colorB = '#e0e3de';
    var direccion = 'to bottom';
    // Cuando el valor guardado no se puede representar con las muestras, manda
    // el campo "Avanzado" y las muestras no lo tocan hasta que alguien las
    // cambie: así un fondo con otra forma nunca se altera por abrir el editor.
    var usarAvanzado = false;
    var avanzado = '';

    function direccionConocida(d) {
      var elegida = (d || 'to bottom').trim();
      return DIRECCIONES_FONDO.some(function(p) { return p[1] === elegida; });
    }

    /** Deduce el estado del control a partir de un valor guardado. */
    function cargar(v) {
      var valor = (typeof v === 'string' ? v : '').trim();
      modo = 'plano';
      colorPlano = '';
      colorA = '#0a0a0a';
      colorB = '#e0e3de';
      direccion = 'to bottom';
      usarAvanzado = false;
      avanzado = '';

      var partes = RE_FONDO_DEGRADADO.exec(valor);
      if (/^#[0-9a-fA-F]{6}$/.test(valor)) {
        colorPlano = valor;
      } else if (partes && direccionConocida(partes[1])) {
        modo = 'degradado';
        direccion = (partes[1] || 'to bottom').trim();
        colorA = partes[2];
        colorB = partes[3];
      } else if (valor) {
        usarAvanzado = true;
        avanzado = valor;
        // Un degradado guardado que no se pudo leer se muestra en su pestaña,
        // no en la de color plano.
        if (/gradient\s*\(/.test(valor)) modo = 'degradado';
      }
    }

    function valorEfectivo() {
      if (usarAvanzado) return avanzado.trim();
      if (modo === 'plano') return colorPlano;
      return 'linear-gradient(' + direccion + ', ' + colorA + ' 0%, ' + colorB + ' 100%)';
    }

    var wrap = document.createElement('div');
    wrap.className = 'bg-ctrl';

    var ESTILO_SWATCH = 'width:40px;height:34px;border:1px solid #2a2a2a;border-radius:6px;'
      + 'cursor:pointer;padding:2px;background:#111;flex:0 0 auto;';

    /** Una muestra de color con su etiqueta ("Desde", "Hasta") y su valor. */
    function crearCampoColor(texto, alElegir) {
      var label = document.createElement('label');
      // El estilo va en línea porque la regla general de .block-body pone las
      // etiquetas en bloque y en mayúsculas, y aquí van en línea y en minúscula.
      label.style.cssText = 'display:inline-flex;align-items:center;gap:6px;margin:0;'
        + 'font-size:11px;color:#aaa;text-transform:none;letter-spacing:0;';

      var input = document.createElement('input');
      input.type = 'color';
      input.style.cssText = ESTILO_SWATCH;
      input.addEventListener('input', function() { alElegir(this.value); });

      var hex = document.createElement('span');
      hex.style.cssText = 'font-family:monospace;font-size:11px;color:#aaa;';

      label.appendChild(document.createTextNode(texto));
      label.appendChild(input);
      label.appendChild(hex);
      return { el: label, input: input, hex: hex };
    }

    function crearRadio(valorModo, texto) {
      var label = document.createElement('label');
      label.style.cssText = 'display:inline-flex;align-items:center;gap:6px;margin:0;'
        + 'font-size:12px;color:#ccc;text-transform:none;letter-spacing:0;cursor:pointer;';

      var input = document.createElement('input');
      input.type = 'radio';
      input.name = 'bg-ctrl-modo-' + (++bgCtrlSeq);
      input.value = valorModo;
      input.style.cssText = 'width:auto;margin:0;accent-color:#1db954;cursor:pointer;';
      input.addEventListener('change', function() {
        if (!this.checked) return;
        modo = valorModo;
        usarAvanzado = false;
        // Al pasar a degradado, el color plano que hubiera se convierte en la
        // primera parada: el color elegido no se pierde.
        if (modo === 'degradado' && colorPlano) colorA = colorPlano;
        refrescar(true);
      });

      label.appendChild(input);
      label.appendChild(document.createTextNode(texto));
      return { label: label, input: input };
    }

    // --- Color plano o degradado
    var modosEl = document.createElement('div');
    modosEl.className = 'bg-ctrl-modos';
    var radioPlano = crearRadio('plano', 'Color plano');
    var radioDeg = crearRadio('degradado', 'Degradado');
    modosEl.appendChild(radioPlano.label);
    modosEl.appendChild(radioDeg.label);
    wrap.appendChild(modosEl);

    // --- Panel de color plano
    var panelPlano = document.createElement('div');
    panelPlano.className = 'bg-ctrl-panel';
    var filaPlano = document.createElement('div');
    filaPlano.className = 'bg-ctrl-fila';

    var swatchPlano = document.createElement('input');
    swatchPlano.type = 'color';
    swatchPlano.value = '#0a0a0a';
    swatchPlano.style.cssText = ESTILO_SWATCH;
    swatchPlano.addEventListener('input', function() {
      colorPlano = this.value;
      usarAvanzado = false;
      refrescar(true);
    });

    var hexPlano = document.createElement('span');
    hexPlano.style.cssText = 'font-family:monospace;font-size:12px;color:#aaa;';

    filaPlano.appendChild(swatchPlano);
    filaPlano.appendChild(hexPlano);
    panelPlano.appendChild(filaPlano);
    wrap.appendChild(panelPlano);

    // --- Panel de degradado
    var panelDeg = document.createElement('div');
    panelDeg.className = 'bg-ctrl-panel';
    var filaColores = document.createElement('div');
    filaColores.className = 'bg-ctrl-fila';

    var campoA = crearCampoColor('Desde', function(v) { colorA = v; usarAvanzado = false; refrescar(true); });
    var campoB = crearCampoColor('Hasta', function(v) { colorB = v; usarAvanzado = false; refrescar(true); });
    filaColores.appendChild(campoA.el);
    filaColores.appendChild(campoB.el);

    var selectDir = document.createElement('select');
    selectDir.style.cssText = 'width:auto;padding:6px 8px;font-size:12px;';
    DIRECCIONES_FONDO.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p[1];
      opt.textContent = p[0];
      selectDir.appendChild(opt);
    });
    selectDir.addEventListener('change', function() {
      direccion = this.value;
      usarAvanzado = false;
      refrescar(true);
    });

    var filaDir = document.createElement('div');
    filaDir.className = 'bg-ctrl-fila';
    var labelDir = document.createElement('label');
    labelDir.style.cssText = 'display:inline-flex;align-items:center;gap:6px;margin:0;'
      + 'font-size:11px;color:#aaa;text-transform:none;letter-spacing:0;';
    labelDir.appendChild(document.createTextNode('Dirección'));
    labelDir.appendChild(selectDir);
    filaDir.appendChild(labelDir);

    panelDeg.appendChild(filaColores);
    panelDeg.appendChild(filaDir);
    wrap.appendChild(panelDeg);

    // --- Vista previa: el degradado tal como se verá, antes de guardar
    var preview = document.createElement('div');
    preview.className = 'bg-ctrl-preview';
    wrap.appendChild(preview);

    var btnSinFondo = document.createElement('button');
    btnSinFondo.type = 'button';
    btnSinFondo.textContent = 'Sin fondo';
    btnSinFondo.style.cssText = 'background:none;border:1px solid #2a2a2a;color:#aaa;'
      + 'border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;align-self:flex-start;';
    btnSinFondo.addEventListener('click', function() {
      // Se conservan las paradas y la dirección: si vuelve a elegir Degradado,
      // recupera el mismo degradado que tenía armado.
      modo = 'plano';
      colorPlano = '';
      usarAvanzado = false;
      avanzado = '';
      refrescar(true);
    });
    wrap.appendChild(btnSinFondo);

    // --- Avanzado: el campo de texto de siempre, para lo que el control no arma
    var detalles = document.createElement('details');
    detalles.className = 'bg-ctrl-avanzado';
    var resumen = document.createElement('summary');
    resumen.textContent = 'Avanzado (pegar CSS a mano)';
    detalles.appendChild(resumen);

    var notaAvanzado = document.createElement('small');
    notaAvanzado.className = 'bg-ctrl-nota';
    notaAvanzado.textContent = 'Solo para fondos que las opciones de arriba no pueden armar '
      + '(degradados radiales, tres colores o valores guardados con otra forma). '
      + 'Lo que se escriba aquí reemplaza lo de arriba.';

    var inputAvanzado = document.createElement('input');
    inputAvanzado.type = 'text';
    inputAvanzado.placeholder = 'linear-gradient(to bottom, #0A0A0A, #E0E3DE)';
    inputAvanzado.addEventListener('input', function() {
      usarAvanzado = true;
      avanzado = this.value;
      refrescar(true);
    });

    var aviso = document.createElement('small');
    aviso.className = 'bg-ctrl-aviso';
    aviso.hidden = true;
    aviso.textContent = '⚠ Este valor no es un color ni un degradado que el navegador '
      + 'pueda aplicar: el fondo quedaría vacío.';

    detalles.appendChild(notaAvanzado);
    detalles.appendChild(inputAvanzado);
    detalles.appendChild(aviso);
    wrap.appendChild(detalles);

    function refrescar(notificar) {
      radioPlano.input.checked = modo === 'plano';
      radioDeg.input.checked = modo === 'degradado';
      panelPlano.style.display = modo === 'plano' ? 'flex' : 'none';
      panelDeg.style.display = modo === 'degradado' ? 'flex' : 'none';

      swatchPlano.value = colorPlano || '#0a0a0a';
      hexPlano.textContent = colorPlano || 'Sin fondo';
      campoA.input.value = colorA;
      campoA.hex.textContent = colorA;
      campoB.input.value = colorB;
      campoB.hex.textContent = colorB;
      selectDir.value = direccion;

      var v = valorEfectivo();
      var aplica = fondoAplicable(v);

      if (!v) {
        preview.style.background = '';
        preview.textContent = 'Sin fondo';
      } else if (aplica) {
        preview.style.background = v;
        preview.textContent = '';
      } else {
        preview.style.background = '';
        preview.textContent = 'Este valor no se puede aplicar';
      }

      // El campo Avanzado refleja el valor vigente, lo generen las muestras o
      // se haya escrito ahí. Solo se reescribe si cambió, para no mover el
      // cursor mientras se escribe.
      var textoAvanzado = usarAvanzado ? avanzado : v;
      if (inputAvanzado.value !== textoAvanzado) inputAvanzado.value = textoAvanzado;
      aviso.hidden = aplica;
      // Al abrir el editor con un valor que las muestras no pueden mostrar, el
      // apartado Avanzado aparece desplegado para que se vea de dónde sale.
      if (usarAvanzado) detalles.open = true;

      if (notificar && alCambiar) alCambiar(v);
    }

    cargar(valorInicial);
    refrescar(false);

    return {
      el: wrap,
      set: function(v) { cargar(v); refrescar(false); }
    };
  }

  // Rellena el body de un bloque con sus campos de props. Se extrae de
  // renderBlocks para poder re-invocarla sola cuando cambia el modo del
  // carrusel de productos, sin reconstruir toda la lista de bloques (eso
  // perdería el estado expandido/colapsado de cada bloque, que solo vive
  // como clase CSS en el DOM y no se persiste en ninguna variable).
  function fillBlockBody(body, i, block, def) {
    body.innerHTML = '';
    if (!def || !def.props) return;
    def.props.forEach(function(prop) {
      // Visibilidad condicional del carrusel de productos según su modo
      if (block.type === 'product-carousel') {
        var mode = block.props.mode || 'category';
        if ((prop === 'category' || prop === 'max_items') && mode !== 'category') return;
        if (prop === 'slides' && mode !== 'manual') return;
      }

      // Los slots de imagen llevan sus propias etiquetas ("Horizontal — Desktop",
      // "Vertical — Móvil"), así que no se les antepone la etiqueta genérica.
      var usesSlots =
        (prop === 'bg_url' && block.type === 'hero' && block.props.bg_type !== 'video') ||
        (prop === 'url' && block.type === 'image');

      if (!usesSlots) {
        var labelEl = document.createElement('label');
        labelEl.textContent = formatPropLabel(prop);
        body.appendChild(labelEl);
      }

      if (prop === 'mode' && block.type === 'product-carousel') {
        var modeSelect = document.createElement('select');
        [['category', 'Categoría (automático)'], ['manual', 'Manual (slides personalizados)']].forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o[0];
          opt.textContent = o[1];
          modeSelect.appendChild(opt);
        });
        modeSelect.value = block.props.mode || 'category';
        modeSelect.addEventListener('change', function() {
          blocks[i].props.mode = this.value;
          fillBlockBody(body, i, blocks[i], def); // re-render solo este body
        });
        body.appendChild(modeSelect);
      } else if (prop === 'slides') {
        body.appendChild(buildSlidesEditor(i));
      } else if (ARRAY_FIELD_DEFS[prop]) {
        body.appendChild(buildArrayEditor(i, prop));
      } else if (prop === 'category') {
        var select = document.createElement('select');
        var optAll = document.createElement('option');
        optAll.value = '';
        optAll.textContent = 'Todas las categorías';
        select.appendChild(optAll);
        PRODUCT_CATEGORIES.forEach(function(cat) {
          var opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          select.appendChild(opt);
        });
        select.value = block.props[prop] || '';
        select.addEventListener('change', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
        body.appendChild(select);
      } else if (prop === 'content' || prop === 'description') {
        var ta = document.createElement('textarea');
        ta.value = block.props[prop] || '';
        ta.addEventListener('input', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
        body.appendChild(ta);
      } else if (prop === 'bg_url' && block.type === 'hero') {
        // Hero: file upload para imagen, URL input para video
        var bgType = block.props.bg_type || '';
        if (bgType === 'video') {
          // Video: input de URL
          var urlInput = document.createElement('input');
          urlInput.type = 'text';
          urlInput.placeholder = 'https://...';
          urlInput.value = typeof block.props.bg_url === 'string' ? block.props.bg_url : '';
          urlInput.addEventListener('input', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
          body.appendChild(urlInput);
        } else {
          body.appendChild(buildImageSlotsGroup(i, block, def, 'hero'));
        }
      } else if (prop === 'url' && block.type === 'image') {
        body.appendChild(buildImageSlotsGroup(i, block, def, 'image'));
      } else if (prop === 'alt' && block.type === 'image') {
        var altInput = document.createElement('input');
        altInput.value = block.props[prop] || '';
        altInput.placeholder = 'Ej: Consola de mezcla Yamaha CL5 en evento';
        altInput.addEventListener('input', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
        body.appendChild(altInput);
        var altHelp = document.createElement('small');
        altHelp.style.cssText = 'display:block;color:#888;font-size:10px;margin-top:2px;line-height:1.4;';
        altHelp.textContent = 'Describe la imagen para lectores de pantalla y SEO. Si es decorativa, déjalo vacío.';
        body.appendChild(altHelp);
      } else if (prop === 'button_style') {
        var styleSelect = document.createElement('select');
        [
          ['1', 'Verde actual (default)'],
          ['2', 'Verde WhatsApp — tono translúcido con glow'],
          ['3', 'Verde neón — 70% opacidad + hover luminoso']
        ].forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o[0];
          opt.textContent = o[1];
          styleSelect.appendChild(opt);
        });
        styleSelect.value = block.props[prop] || '1';
        styleSelect.addEventListener('change', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
        body.appendChild(styleSelect);
      } else if (prop === 'bg_color') {
        // El fondo se elige con dos muestras de color y una dirección en
        // palabras, con vista previa; el texto libre queda en "Avanzado".
        var fondoCtrl = crearControlFondo(block.props[prop] || '', (function(idx, p) {
          return function(nuevo) { blocks[idx].props[p] = nuevo; };
        })(i, prop));
        body.appendChild(fondoCtrl.el);
      } else if (prop === 'title_color' || prop === 'text_color') {
        // Mismo control que el fondo, pero sin el campo de degradado: un color
        // de texto es siempre un color plano. El selector nativo no admite
        // "vacío", así que mientras no haya una elección la etiqueta lo dice y
        // el color que muestre el recuadro no se aplica — la variable CSS solo
        // se escribe cuando hay un color elegido.
        var txtWrap = document.createElement('div');
        txtWrap.style.cssText = 'display:flex;align-items:center;gap:8px;';

        var txtDefault = prop === 'title_color' ? '#ffffff' : '#b0b0b0';

        var txtInput = document.createElement('input');
        txtInput.type = 'color';
        txtInput.value = block.props[prop] || txtDefault;
        txtInput.style.cssText = 'width:40px;height:34px;border:1px solid #2a2a2a;border-radius:6px;cursor:pointer;padding:2px;background:#111;';

        var txtLabel = document.createElement('span');
        txtLabel.textContent = block.props[prop] || 'Sin color';
        txtLabel.style.cssText = 'font-size:12px;color:#aaa;font-family:monospace;';

        txtInput.addEventListener('input', (function(idx, p, label) {
          return function() {
            blocks[idx].props[p] = this.value;
            label.textContent = this.value;
          };
        })(i, prop, txtLabel));

        var txtClearBtn = document.createElement('button');
        txtClearBtn.type = 'button';
        txtClearBtn.textContent = 'Sin color';
        txtClearBtn.style.cssText = 'background:none;border:1px solid #2a2a2a;color:#aaa;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;';
        txtClearBtn.addEventListener('click', (function(idx, p, inputEl, labelEl, fallback) {
          return function() {
            blocks[idx].props[p] = '';
            inputEl.value = fallback;
            labelEl.textContent = 'Sin color';
          };
        })(i, prop, txtInput, txtLabel, txtDefault));

        txtWrap.appendChild(txtInput);
        txtWrap.appendChild(txtLabel);
        txtWrap.appendChild(txtClearBtn);
        body.appendChild(txtWrap);
      } else if (prop === 'style' && block.type === 'spacer') {
        var styleSelect = document.createElement('select');
        [
          ['0', 'Simple — solo espacio vertical'],
          ['1', 'Bits de sonido — cuadritos pixelados tipo ecualizador'],
          ['2', 'Línea lumínica — trazo verde neón con glow sutil'],
          ['3', 'Línea semigruesa — 4px translúcida'],
          ['4', 'Línea semidelgada — 1px translúcida'],
          ['5', 'Espectro — barras verticales que cruzan ambos bloques']
        ].forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o[0];
          opt.textContent = o[1];
          styleSelect.appendChild(opt);
        });
        styleSelect.value = block.props[prop] || '0';
        styleSelect.addEventListener('change', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
        body.appendChild(styleSelect);
      } else if (prop === 'margin_top' || prop === 'margin_bottom') {
        var numWrap = document.createElement('div');
        numWrap.style.cssText = 'display:flex;align-items:center;gap:6px;';

        var numInput = document.createElement('input');
        numInput.type = 'number';
        numInput.step = '1';
        numInput.value = block.props[prop] || '0';
        numInput.style.cssText = 'width:80px;';
        numInput.placeholder = '0';

        var unitLabel = document.createElement('span');
        unitLabel.textContent = 'px (negativo = sube)';
        unitLabel.style.cssText = 'font-size:11px;color:#888;white-space:nowrap;';

        numInput.addEventListener('input', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));

        numWrap.appendChild(numInput);
        numWrap.appendChild(unitLabel);
        body.appendChild(numWrap);
      } else {
        var input = document.createElement('input');
        input.value = block.props[prop] || '';
        input.addEventListener('input', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
        body.appendChild(input);
      }
    });
  }

  // Renderizar lista de bloques
  function renderBlocks() {
    els.blockList.innerHTML = '';
    els.blockCount.textContent = blocks.length;
    if (blocks.length === 0) {
      els.blockList.innerHTML = '<div class="empty-state" id="emptyBlocks">No hay bloques. Selecciona uno de la paleta superior.</div>';
      return;
    }
    blocks.forEach(function(block, i) {
      var def = BLOCK_TYPES.find(function(b) { return b.type === block.type; });
      var icon = def ? def.icon : '❓';
      var label = def ? def.label : block.type;
      var summary = getBlockSummary(block);

      var div = document.createElement('div');
      div.className = 'editor-block';
      div.innerHTML = '<div class="block-header">' +
        '<span class="block-type-icon">' + icon + '</span>' +
        '<span class="block-type-name">' + label + '</span>' +
        '<span class="block-summary">' + escapeHtml(summary) + '</span>' +
        '<span class="block-actions">' +
          '<button class="move-up" title="Subir">↑</button>' +
          '<button class="move-down" title="Bajar">↓</button>' +
          '<button class="delete" title="Eliminar">✕</button>' +
        '</span>' +
      '</div>' +
      '<div class="block-body"></div>';

      // Llenar body con campos de props
      var body = div.querySelector('.block-body');
      fillBlockBody(body, i, block, def);

      // Eventos de la cabecera
      var header = div.querySelector('.block-header');
      header.addEventListener('click', function(e) {
        if (e.target.closest('button')) return; // no toggle si click en botón
        toggleBlock(i);
      });
      div.querySelector('.move-up').addEventListener('click', function(e) { e.stopPropagation(); moveBlock(i, -1); });
      div.querySelector('.move-down').addEventListener('click', function(e) { e.stopPropagation(); moveBlock(i, 1); });
      div.querySelector('.delete').addEventListener('click', function(e) { e.stopPropagation(); removeBlock(i); });

      els.blockList.appendChild(div);
    });
  }

  function getBlockSummary(block) {
    var def = BLOCK_TYPES.find(function(b) { return b.type === block.type; });
    if (!def || !def.props) return '';
    var firstProp = def.props[0];
    var val = block.props[firstProp];
    return val ? String(val).substring(0, 50) : '(sin configurar)';
  }

  var PROP_LABEL_OVERRIDES = { category: 'Categoría', mode: 'Modo', slides: 'Slides (Manual)', bg_url: 'Fondo (BG)', bg_type: 'Tipo de fondo', url: 'Imagen', alt: 'Texto alternativo (ALT)', section_title: 'Título de sección', faqs: 'Preguntas', button_style: 'Estilo de botón', title_color: 'Color del título', text_color: 'Color del texto' };
  function formatPropLabel(prop) {
    if (PROP_LABEL_OVERRIDES[prop]) return PROP_LABEL_OVERRIDES[prop];
    return prop.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
  }

  // ========== Guardar ==========
  function collectContentJson() {
    if (blocks.length === 0) return null;
    return JSON.stringify(blocks);
  }

  // Anchos de las variantes responsive. Deben coincidir con los que anuncia
  // imgVariants() en public/js/app.js y con VARIANT_WIDTHS en src/routes/upload.ts.
  var VARIANT_WIDTHS = [640, 1280];

  // Redimensiona `file` a `targetWidth` px de ancho y lo reencoda como WebP.
  // Nunca agranda: si el original ya es más angosto, devuelve el original tal
  // cual (así la variante existe y el navegador no recibe un 404). Resuelve
  // null si no se pudo generar, para que la subida siga funcionando igual que
  // antes de este cambio.
  function buildVariantBlob(file, targetWidth) {
    return new Promise(function(resolve) {
      var objectUrl = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function() {
        var w = img.naturalWidth;
        var h = img.naturalHeight;
        URL.revokeObjectURL(objectUrl);
        if (!w || !h) { resolve(null); return; }
        if (w <= targetWidth) { resolve(file); return; }

        var canvas = document.createElement('canvas');
        canvas.width = targetWidth;
        canvas.height = Math.max(1, Math.round(h * (targetWidth / w)));
        var ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(function(blob) {
          // Algunos navegadores ignoran 'image/webp' y devuelven PNG. Servirlo
          // como .webp rompería la imagen (las respuestas de /api/media van con
          // X-Content-Type-Options: nosniff), así que se descarta.
          resolve(blob && blob.type === 'image/webp' ? blob : null);
        }, 'image/webp', 0.82);
      };
      img.onerror = function() { URL.revokeObjectURL(objectUrl); resolve(null); };
      img.src = objectUrl;
    });
  }

  // Sube una imagen y, si es .webp, sus variantes -640 / -1280.
  //
  // Las variantes son obligatorias para que el srcset de los bloques Cards y
  // Galería funcione: imgVariants() (public/js/app.js) deduce las URLs de
  // variante a partir de la del original y el navegador NO cae de vuelta al
  // src si la variante responde 404, así que la imagen desaparecería sin aviso.
  // Solo se generan para .webp porque es el único caso en que aquel emite
  // srcset; el endpoint las ignora si el original no es webp.
  function uploadFile(file) {
    var prepararVariantes = file.type === 'image/webp'
      ? Promise.all(VARIANT_WIDTHS.map(function(width) {
          return buildVariantBlob(file, width).then(function(blob) {
            return { width: width, blob: blob };
          });
        }))
      : Promise.resolve([]);

    return prepararVariantes.then(function(variantes) {
      var formData = new FormData();
      formData.append('file', file);
      variantes.forEach(function(variante) {
        if (variante.blob) {
          formData.append('variant_' + variante.width, variante.blob, 'variant-' + variante.width + '.webp');
        }
      });
      if (variantes.some(function(variante) { return !variante.blob; })) {
        console.warn('No se pudieron generar las variantes responsive (-640/-1280). La imagen se sube igual, pero los bloques Cards y Galería no podrán usarla en srcset.');
      }

      return fetch('/api/upload', {
        method: 'POST',
        body: formData
      });
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error(err.error || 'Error al subir imagen'); });
      return r.json();
    });
  }

  // Sube las imágenes aún no subidas (Files) de los slides manuales del
  // carrusel de productos, y reemplaza cada una por la URL devuelta por R2.
  // Si slide.image ya es un string (URL existente, no se tocó), se deja igual.
  function uploadPendingSlideImages() {
    var uploads = [];
    blocks.forEach(function(block) {
      if (block.type !== 'product-carousel' || !Array.isArray(block.props.slides)) return;
      block.props.slides.forEach(function(slide) {
        if (slide.image && typeof slide.image !== 'string') {
          uploads.push(uploadFile(slide.image).then(function(result) {
            slide.image = result.url;
          }));
        }
      });
    });
    return Promise.all(uploads);
  }

  // Sube las imágenes de fondo de los bloques Hero que aún no se han subido
  // (File objects), en sus dos slots. Si el valor ya es un string (URL
  // existente), se deja igual.
  function uploadPendingHeroImages() {
    var uploads = [];
    blocks.forEach(function(block) {
      if (block.type !== 'hero') return;
      if (block.props.bg_type === 'video') return;
      ['bg_url', 'bg_url_mobile'].forEach(function(prop) {
        if (block.props[prop] && typeof block.props[prop] !== 'string') {
          uploads.push(uploadFile(block.props[prop]).then(function(result) {
            block.props[prop] = result.url;
          }));
        }
      });
    });
    return Promise.all(uploads);
  }

  // Sube las imágenes de bloques "image" que aún no se han subido (File
  // objects), en sus dos slots. Si el valor ya es un string (URL existente),
  // se deja igual.
  function uploadPendingImageBlockImages() {
    var uploads = [];
    blocks.forEach(function(block) {
      if (block.type !== 'image') return;
      ['url', 'url_mobile'].forEach(function(prop) {
        if (block.props[prop] && typeof block.props[prop] !== 'string') {
          uploads.push(uploadFile(block.props[prop]).then(function(result) {
            block.props[prop] = result.url;
          }));
        }
      });
    });
    return Promise.all(uploads);
  }

  // Sube las imágenes de los bloques Cards (cards[].image) que aún son File objects
  function uploadPendingCardImages() {
    var uploads = [];
    blocks.forEach(function(block) {
      if (block.type !== 'cards' || !Array.isArray(block.props.cards)) return;
      block.props.cards.forEach(function(card) {
        if (card.image && typeof card.image !== 'string') {
          uploads.push(uploadFile(card.image).then(function(result) {
            card.image = result.url;
          }));
        }
      });
    });
    return Promise.all(uploads);
  }

  // Sube las imágenes de los bloques Gallery (images[].url) que aún son File objects
  function uploadPendingGalleryImages() {
    var uploads = [];
    blocks.forEach(function(block) {
      if (block.type !== 'gallery' || !Array.isArray(block.props.images)) return;
      block.props.images.forEach(function(img) {
        if (img.url && typeof img.url !== 'string') {
          uploads.push(uploadFile(img.url).then(function(result) {
            img.url = result.url;
          }));
        }
      });
    });
    return Promise.all(uploads);
  }

  function savePage() {
    els.btnSave.disabled = true;
    els.btnSave.textContent = 'Guardando...';
    Promise.all([uploadPendingSlideImages(), uploadPendingHeroImages(), uploadPendingImageBlockImages(), uploadPendingCardImages(), uploadPendingGalleryImages()]).then(function() {
      var body = {
        slug: els.pageSlug.value.trim(),
        title: els.pageTitle.value.trim() || null,
        content_json: collectContentJson(),
        meta_title: els.pageMetaTitle.value.trim() || null,
        meta_description: els.pageMetaDescription.value.trim() || null,
        bg_color: (pageBgValor || '').trim() || null,
        status: els.pageStatus.value
      };
      var url = currentId ? '/api/pages/' + currentId : '/api/pages';
      var method = currentId ? 'PUT' : 'POST';
      return fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
      return r.json();
    }).then(function() {
      hideForm();
      loadPages();
    }).catch(function(err) {
      alert('Error al guardar: ' + err.message);
    }).then(function() {
      els.btnSave.disabled = false;
      els.btnSave.textContent = '💾 Guardar';
    });
  }

  // ========== Cargar / Editar ==========
  function loadPages() {
    fetch('/api/pages?status=all')
      .then(function(r) {
        if (!r.ok) throw new Error('Error del servidor (' + r.status + ')');
        return r.json();
      })
      .then(function(data) {
        var pages = data.pages || data;
        els.pageCount.textContent = '(' + pages.length + ' páginas)';
        renderTable(pages);
      })
      .catch(function(err) {
        console.error('Error cargando páginas:', err);
        alert('Error de conexión. Verifica tu red e inténtalo de nuevo.');
      });
  }

  function renderTable(pages) {
    els.tbody.innerHTML = '';
    pages.forEach(function(p) {
      var tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid #1e1e2e';
      tr.innerHTML =
        '<td style="padding:8px;"><code>' + escapeHtml(p.slug) + '</code></td>' +
        '<td style="padding:8px;">' + escapeHtml(p.title || '') + '</td>' +
        '<td style="padding:8px;"><span style="background:' + (p.status === 'published' ? '#1a3a1a' : '#3a3a1a') + ';color:' + (p.status === 'published' ? '#4caf50' : '#ffc107') + ';padding:2px 8px;border-radius:10px;font-size:11px;">' + escapeHtml(p.status) + '</span></td>' +
        '<td style="padding:8px;"><button class="btn-edit" data-id="' + p.id + '" style="background:none;border:1px solid #3a3a4a;color:#aaa;border-radius:4px;padding:4px 8px;cursor:pointer;margin-right:4px;">✏️</button><button class="btn-delete" data-id="' + p.id + '" style="background:none;border:1px solid #3a3a4a;color:#aaa;border-radius:4px;padding:4px 8px;cursor:pointer;">🗑️</button></td>';
      els.tbody.appendChild(tr);
    });

    mod.querySelectorAll('.btn-edit').forEach(function(btn) {
      btn.addEventListener('click', function() { editPage(this.dataset.id); });
    });
    mod.querySelectorAll('.btn-delete').forEach(function(btn) {
      btn.addEventListener('click', function() { deletePage(this.dataset.id); });
    });
  }

  function editPage(id) {
    fetch('/api/pages/' + id)
      .then(function(r) {
        if (!r.ok) throw new Error('Error del servidor (' + r.status + ')');
        return r.json();
      })
      .then(function(page) {
        currentId = page.id;
        els.editorTitle.textContent = 'Editar: ' + (page.title || page.slug);
        els.pageSlug.value = page.slug || '';
        els.pageSlug.readOnly = true;
        els.pageTitle.value = page.title || '';
        els.pageMetaTitle.value = page.meta_title || '';
        els.pageMetaDescription.value = page.meta_description || '';
        // El control de fondo se refresca con el valor guardado, tal cual. Si
        // no encaja en las muestras (un degradado radial, tres colores), se
        // conserva íntegro en "Avanzado" y no se reescribe por abrir la página.
        var savedBg = page.bg_color || '';
        pageBgCtrl.set(savedBg);
        pageBgValor = savedBg;
        els.pageStatus.value = page.status || 'draft';

        // Parsear content_json
        parseContentJson(page.content_json);
        els.editor.style.display = 'block';
        _hasUnsavedChanges = false;
        renderBlocks();
      })
      .catch(function(err) {
        console.error('Error cargando página:', err);
        alert('Error de conexión. Verifica tu red e inténtalo de nuevo.');
      });
  }

  function parseContentJson(raw) {
    blocks = [];
    if (!raw) return;
    try {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        // Nuevo formato: array de bloques
        blocks = parsed;
      } else if (typeof parsed === 'object') {
        // Formato antiguo: objeto clave-valor → convertir a bloques text
        Object.keys(parsed).forEach(function(key) {
          blocks.push({ type: 'text', props: { title: key, content: parsed[key] } });
        });
      }
    } catch(e) {
      blocks = [];
    }
  }

  function deletePage(id) {
    if (!confirm('¿Eliminar esta página?')) return;
    fetch('/api/pages/' + id, { method: 'DELETE' })
      .then(function(r) {
        if (!r.ok) throw new Error('Error del servidor (' + r.status + ')');
        loadPages();
      })
      .catch(function(err) {
        console.error('Error eliminando página:', err);
        alert('Error de conexión. Verifica tu red e inténtalo de nuevo.');
      });
  }

  function showNewForm() {
    currentId = null;
    els.editorTitle.textContent = 'Nueva Página';
    els.pageSlug.value = '';
    els.pageSlug.readOnly = false;
    els.pageTitle.value = '';
    els.pageMetaTitle.value = '';
    els.pageMetaDescription.value = '';
    pageBgCtrl.set('');
    pageBgValor = '';
    els.pageStatus.value = 'draft';
    blocks = [];
    els.editor.style.display = 'block';
    _hasUnsavedChanges = false;
    renderBlocks();
  }

  function hideForm() {
    els.editor.style.display = 'none';
    currentId = null;
    blocks = [];
    _hasUnsavedChanges = false;
  }

  // Previsualizar
  function previewPage() {
    var slug = els.pageSlug.value.trim();
    if (!slug) { alert('Define un slug primero'); return; }
    if (_hasUnsavedChanges) {
      alert('Tienes cambios sin guardar. La previsualización mostrará la última versión guardada.');
    }
    window.open('/' + slug, '_blank');
  }

  // Eventos
  // Fondo de página: se construye una sola vez, con el mismo control que usan
  // los bloques. El valor vigente vive en pageBgValor y es el que envía
  // savePage(); al cargar una página se refresca con pageBgCtrl.set().
  var pageBgValor = '';
  var pageBgCtrl = crearControlFondo('', function(v) { pageBgValor = v; });
  els.pageBgControl.appendChild(pageBgCtrl.el);

  els.btnNew.addEventListener('click', showNewForm);
  els.btnSave.addEventListener('click', savePage);
  els.btnCancel.addEventListener('click', hideForm);
  els.btnPreview.addEventListener('click', previewPage);

  // Util
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Iniciar
  buildPalette();
  loadPages();
  loadProductCategories();
})();
</script>
