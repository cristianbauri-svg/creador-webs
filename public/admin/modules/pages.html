<!-- ============================================================
  admin/modules/pages.html — Editor visual de bloques para páginas dinámicas
  Reemplaza la versión anterior de pares clave-valor genéricos
============================================================ -->
<meta charset="UTF-8">
<style>
  /* === Miniaturas wireframe (paleta Straton) === */
  .block-thumb {
    width: 200px; height: 120px; border-radius: 8px; background: #0a0a0a;
    display: flex; flex-direction: column; gap: 6px; padding: 12px;
    box-sizing: border-box; position: relative; overflow: hidden;
    border: 1px solid #2a2a2a; flex-shrink: 0;
  }
  .block-thumb .line { background: #2a2a2a; border-radius: 4px; }
  .block-thumb .line.wide { width: 70%; height: 10px; }
  .block-thumb .line.medium { width: 50%; height: 8px; }
  .block-thumb .line.short { width: 30%; height: 8px; }
  .block-thumb .btn-fake { width: 40%; height: 18px; background: #1db954; border-radius: 4px; margin-top: auto; }
  .block-thumb .img-fake { width: 100%; height: 50px; background: #1a1a1a; border-radius: 4px; }
  .block-thumb .card-grid { display: flex; gap: 6px; flex: 1; }
  .block-thumb .card-fake { flex: 1; background: #1a1a1a; border-radius: 4px; display: flex; flex-direction: column; padding: 6px; gap: 4px; }
  .block-thumb .card-fake .line { background: #2a2a2a; height: 6px; }
  .block-thumb .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; flex: 1; }
  .block-thumb .grid-2x2 div { background: #1a1a1a; border-radius: 3px; }
  .block-thumb .video-bar { width: 100%; height: 40px; background: #1a1a1a; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .block-thumb .play-triangle { width: 0; height: 0; border-left: 16px solid #2a2a2a; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
  .block-thumb .carousel-single { width: 60%; height: 50px; background: #1a1a1a; border-radius: 6px; margin: 0 auto; display: flex; flex-direction: column; padding: 6px; gap: 4px; }
  .block-thumb .package-col { display: flex; gap: 4px; flex: 1; }
  .block-thumb .package-col div { flex: 1; background: #1a1a1a; border-radius: 4px; }
  .block-thumb .testimonial-bar { display: flex; gap: 4px; align-items: center; flex: 1; }
  .block-thumb .avatar { width: 24px; height: 24px; border-radius: 50%; background: #2a2a2a; flex-shrink: 0; }
  .block-thumb .form-lines { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .block-thumb .form-lines .line { height: 8px; width: 100%; }
  .block-thumb .cta-bg { background: #1db954; opacity: 0.15; position: absolute; inset: 0; }
  .block-thumb .spacer-bar { width: 100%; height: 8px; background: repeating-linear-gradient(90deg, #2a2a2a 0px, #2a2a2a 8px, transparent 8px, transparent 12px); border-radius: 4px; margin: auto 0; }
  .block-thumb .icon-circle { width: 20px; height: 20px; border-radius: 50%; background: #c9a96e; }

  /* === Panel de selección de bloques === */
  #blockPalette {
    display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0;
    max-height: 400px; overflow-y: auto; padding: 8px;
    background: #0a0a0a; border-radius: 10px; border: 1px solid #2a2a2a;
  }
  #blockPalette .palette-item {
    cursor: pointer; border-radius: 10px; padding: 8px;
    background: #111; border: 1px solid #2a2a2a;
    transition: border-color 0.2s, transform 0.15s;
    text-align: center; width: 216px;
  }
  #blockPalette .palette-item:hover {
    border-color: #1db954; transform: translateY(-2px);
  }
  #blockPalette .palette-label {
    font-size: 12px; color: #ccc; margin-top: 6px; font-weight: 600;
  }
  #blockPalette .palette-desc {
    font-size: 10px; color: #888; margin-top: 2px; line-height: 1.3;
  }

  /* === Lista de bloques en el editor === */
  #blockList { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
  .editor-block {
    background: #111; border: 1px solid #2a2a2a; border-radius: 10px;
    overflow: hidden;
  }
  .editor-block .block-header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    cursor: pointer; user-select: none; background: #111;
    transition: background 0.15s;
  }
  .editor-block .block-header:hover { background: #1a1a1a; }
  .editor-block .block-header .block-type-icon { font-size: 20px; flex-shrink: 0; }
  .editor-block .block-header .block-type-name { font-weight: 600; color: #ddd; flex: 1; }
  .editor-block .block-header .block-summary { font-size: 11px; color: #888; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .editor-block .block-header .block-actions { display: flex; gap: 4px; }
  .editor-block .block-header .block-actions button {
    background: none; border: 1px solid #2a2a2a; color: #aaa; border-radius: 6px;
    padding: 4px 8px; cursor: pointer; font-size: 14px; transition: all 0.15s;
  }
  .editor-block .block-header .block-actions button:hover {
    background: #1a1a1a; color: #fff;
  }
  .editor-block .block-header .block-actions button.delete:hover {
    background: #3a1a1a; border-color: #ff4444; color: #ff4444;
  }
  .editor-block .block-body {
    display: none; padding: 14px; border-top: 1px solid #2a2a2a;
    background: #0a0a0a;
  }
  .editor-block.expanded .block-body { display: block; }
  .editor-block .block-body label {
    display: block; font-size: 11px; color: #888; margin: 8px 0 3px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .editor-block .block-body input,
  .editor-block .block-body textarea,
  .editor-block .block-body select {
    width: 100%; padding: 8px 10px; border-radius: 6px;
    background: #111; border: 1px solid #2a2a2a; color: #ddd;
    font-size: 13px; box-sizing: border-box;
  }
  .editor-block .block-body textarea { min-height: 70px; resize: vertical; }
  .editor-block .block-body .field-row { display: flex; gap: 8px; }
  .editor-block .block-body .field-row > * { flex: 1; }

  /* === Botones de acción (verde acento) === */
  #btnSave { background: #1db954; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  #btnSave:hover { background: #1ed760; }
  #btnNewPage { background: #1db954; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  #btnNewPage:hover { background: #1ed760; }
  #btnPreview { background: #1a1a1a; color: #ddd; border: 1px solid #2a2a2a; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
  #btnPreview:hover { background: #222; }
  #btnCancel { background: none; color: #aaa; border: 1px solid #2a2a2a; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
  #btnCancel:hover { background: #1a1a1a; color: #fff; }

  /* === Vista previa y estados vacíos === */
  #previewFrame { display: none; }
  .empty-state { text-align: center; color: #666; padding: 30px; font-size: 13px; }

  /* === Formulario de metadatos (inputs) === */
  #pageMetaForm input, #pageMetaForm textarea, #pageMetaForm select {
    background: #111; border: 1px solid #2a2a2a; color: #ddd;
  }
  #pageMetaForm input:focus, #pageMetaForm textarea:focus, #pageMetaForm select:focus {
    border-color: #1db954; outline: none;
  }
  .editor-block .block-body input:focus,
  .editor-block .block-body textarea:focus {
    border-color: #1db954; outline: none;
  }

  /* === Editor de arrays (cards / gallery / testimonials) === */
  .array-editor-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .array-editor-empty { font-size: 11px; color: #666; padding: 10px; text-align: center; background: #111; border: 1px dashed #2a2a2a; border-radius: 8px; }
  .array-editor-item {
    background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 10px;
  }
  .array-editor-item-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px; font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .array-editor-item label {
    display: block; font-size: 10px; color: #777; margin: 6px 0 3px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .array-editor-item input,
  .array-editor-item textarea {
    width: 100%; padding: 6px 8px; border-radius: 6px;
    background: #0a0a0a; border: 1px solid #2a2a2a; color: #ddd;
    font-size: 12px; box-sizing: border-box;
  }
  .array-editor-item textarea { min-height: 50px; resize: vertical; }
  .array-editor-item input:focus,
  .array-editor-item textarea:focus { border-color: #1db954; outline: none; }
  .array-editor-remove {
    background: none; border: 1px solid #2a2a2a; color: #aaa; border-radius: 6px;
    padding: 2px 8px; cursor: pointer; font-size: 12px; transition: all 0.15s;
  }
  .array-editor-remove:hover { background: #3a1a1a; border-color: #ff4444; color: #ff4444; }
  .array-editor-add {
    background: #1db954; color: #fff; border: none; padding: 8px 14px;
    border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px;
  }
  .array-editor-add:hover { background: #1ed760; }
</style>

<!-- ==================== HTML ==================== -->
<div id="pagesModule">
  <!-- Toolbar -->
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
    <button id="btnNewPage">+ Nueva Página</button>
    <span style="color:#888;font-size:12px;" id="pageCount"></span>
  </div>

  <!-- Tabla de páginas existentes -->
  <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:13px;" id="pagesTable">
      <thead><tr style="text-align:left;border-bottom:1px solid #2a2a3a;"><th style="padding:8px;">Slug</th><th style="padding:8px;">Título</th><th style="padding:8px;">Estado</th><th style="padding:8px;">Acciones</th></tr></thead>
      <tbody id="pagesTableBody"></tbody>
    </table>
  </div>

  <!-- Formulario de edición/creación (oculto por defecto) -->
  <div id="pageEditor" style="display:none;margin-top:20px;">
    <h3 style="margin:0 0 12px;color:#ddd;" id="editorTitle">Nueva Página</h3>

    <!-- Metadatos -->
    <div id="pageMetaForm">
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <div style="flex:1;min-width:200px;">
          <label>Slug</label>
          <input id="pageSlug" placeholder="mi-pagina" />
        </div>
        <div style="flex:1;min-width:200px;">
          <label>Título</label>
          <input id="pageTitle" placeholder="Título de la página" />
        </div>
        <div style="flex:0 0 140px;">
          <label>Estado</label>
          <select id="pageStatus"><option value="draft">Borrador</option><option value="published">Publicado</option></select>
        </div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <div style="flex:1;min-width:200px;">
          <label>Meta Title</label>
          <input id="pageMetaTitle" placeholder="Título SEO" />
        </div>
        <div style="flex:1;min-width:200px;">
          <label>Meta Description</label>
          <textarea id="pageMetaDescription" placeholder="Descripción SEO"></textarea>
        </div>
      </div>
    </div>

    <!-- Paleta de bloques -->
    <div style="margin-top:16px;">
      <h4 style="color:#ccc;margin:0 0 8px;">Añadir bloque</h4>
      <div id="blockPalette"></div>
    </div>

    <!-- Lista de bloques -->
    <h4 style="color:#ccc;margin:16px 0 8px;">Bloques de la página (<span id="blockCount">0</span>)</h4>
    <div id="blockList">
      <div class="empty-state" id="emptyBlocks">No hay bloques. Selecciona uno de la paleta superior.</div>
    </div>

    <!-- Botones de acción -->
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
      <button id="btnSave">💾 Guardar</button>
      <button id="btnPreview">👁 Previsualizar</button>
      <button id="btnCancel">Cancelar</button>
    </div>
  </div>
</div>

<!-- ==================== SCRIPT ==================== -->
<script>
(function() {
  var mod = document.getElementById('pagesModule');
  var currentId = null;
  var blocks = []; // Array de bloques actuales

  // Referencias DOM
  var els = {
    btnNew: mod.querySelector('#btnNewPage'),
    pageCount: mod.querySelector('#pageCount'),
    tbody: mod.querySelector('#pagesTableBody'),
    editor: mod.querySelector('#pageEditor'),
    editorTitle: mod.querySelector('#editorTitle'),
    pageSlug: mod.querySelector('#pageSlug'),
    pageTitle: mod.querySelector('#pageTitle'),
    pageStatus: mod.querySelector('#pageStatus'),
    pageMetaTitle: mod.querySelector('#pageMetaTitle'),
    pageMetaDescription: mod.querySelector('#pageMetaDescription'),
    palette: mod.querySelector('#blockPalette'),
    blockList: mod.querySelector('#blockList'),
    emptyBlocks: mod.querySelector('#emptyBlocks'),
    blockCount: mod.querySelector('#blockCount'),
    btnSave: mod.querySelector('#btnSave'),
    btnPreview: mod.querySelector('#btnPreview'),
    btnCancel: mod.querySelector('#btnCancel')
  };

  // Definición de tipos de bloques
  var BLOCK_TYPES = [
    { type: 'hero', icon: '🦸', label: 'Hero', desc: 'Fondo con título, subtítulo y botón', thumb: '<div class="line wide"></div><div class="line medium"></div><div class="line short"></div><div class="btn-fake"></div>', props: ['bg_type','bg_url','title','subtitle','button_text','button_link'] },
    { type: 'text', icon: '📝', label: 'Texto', desc: 'Título y contenido enriquecido', thumb: '<div class="line wide"></div><div class="line medium"></div><div class="line medium"></div><div class="line short"></div>', props: ['title','content'] },
    { type: 'cards', icon: '🃏', label: 'Cards', desc: '2-4 tarjetas con imagen y texto', thumb: '<div class="line wide" style="width:40%"></div><div class="card-grid"><div class="card-fake"><div class="line"></div><div class="line"></div></div><div class="card-fake"><div class="line"></div><div class="line"></div></div><div class="card-fake"><div class="line"></div><div class="line"></div></div></div>', props: ['section_title','cards'] },
    { type: 'image', icon: '🖼️', label: 'Imagen', desc: 'Imagen a ancho completo con pie', thumb: '<div class="img-fake"></div><div class="line short" style="margin-top:4px"></div>', props: ['url','alt','caption'] },
    { type: 'gallery', icon: '🖼️', label: 'Galería', desc: 'Galería de imágenes en grilla', thumb: '<div class="grid-2x2"><div></div><div></div><div></div><div></div></div>', props: ['section_title','images'] },
    { type: 'video', icon: '🎬', label: 'Video', desc: 'Video de YouTube o Vimeo', thumb: '<div class="video-bar"><div class="play-triangle"></div></div>', props: ['url','title'] },
    { type: 'product-carousel', icon: '🎵', label: 'Carrusel Productos', desc: '1 card, autoplay, textos grandes. Imagen recomendada: 800×600px (proporción 4:3)', thumb: '<div class="carousel-single"><div class="line" style="width:60%"></div><div class="line" style="width:80%"></div></div>', props: ['section_title','mode','category','max_items','slides'] },
    { type: 'packages', icon: '📦', label: 'Paquetes', desc: 'Parrilla de paquetes con precios', thumb: '<div class="line wide" style="width:30%"></div><div class="package-col"><div></div><div style="border:1px solid #1db954"></div><div></div></div>', props: ['section_title'] },
    { type: 'testimonials', icon: '💬', label: 'Testimonios', desc: 'Carrusel de testimonios', thumb: '<div class="line wide" style="width:30%"></div><div class="testimonial-bar"><div class="avatar"></div><div class="form-lines"><div class="line"></div><div class="line"></div></div></div>', props: ['section_title','testimonials'] },
    { type: 'contact-form', icon: '📬', label: 'Formulario', desc: 'Formulario de contacto', thumb: '<div class="line wide" style="width:40%"></div><div class="form-lines"><div class="line" style="width:90%"></div><div class="line" style="width:70%"></div><div class="line" style="width:50%"></div></div>', props: ['title','description'] },
    { type: 'cta', icon: '📢', label: 'CTA', desc: 'Llamado a la acción con fondo', thumb: '<div style="position:relative;flex:1"><div class="cta-bg"></div><div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;padding:8px"><div class="line wide" style="background:#fff3"></div><div class="btn-fake"></div></div></div>', props: ['bg_color','title','subtitle','button_text','button_link'] },
    { type: 'spacer', icon: '↕️', label: 'Espaciador', desc: 'Separador vertical ajustable', thumb: '<div class="spacer-bar"></div>', props: ['height'] },
    { type: 'section-header', icon: '🏷️', label: 'Encabezado', desc: 'Título de sección con ícono', thumb: '<div style="display:flex;align-items:center;gap:8px"><div class="icon-circle"></div><div class="line wide"></div></div>', props: ['title','icon'] }
  ];

  // Definición de campos para props de tipo array (editor con sub-formulario)
  var ARRAY_FIELD_DEFS = {
    cards: {
      items: ['image', 'title', 'description', 'link'],
      labels: { image: 'Imagen (URL)', title: 'Título', description: 'Descripción', link: 'Link' },
      addLabel: '+ Añadir Card'
    },
    images: {
      items: ['url', 'alt'],
      labels: { url: 'URL', alt: 'Alt' },
      addLabel: '+ Añadir Imagen'
    },
    testimonials: {
      items: ['text', 'author'],
      labels: { text: 'Texto', author: 'Autor' },
      addLabel: '+ Añadir Testimonio'
    }
  };

  // Categorías de productos disponibles, para el select del carrusel dinámico
  var PRODUCT_CATEGORIES = [];
  function loadProductCategories() {
    fetch('/api/products?per_page=100')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var items = Array.isArray(data) ? data : (data.products || []);
        var set = {};
        items.forEach(function(p) { if (p.category) set[p.category] = true; });
        PRODUCT_CATEGORIES = Object.keys(set).sort();
        renderBlocks();
      })
      .catch(function() { PRODUCT_CATEGORIES = []; });
  }

  // Construye el sub-editor de un prop de tipo array (cards/images/testimonials)
  function buildArrayEditor(blockIndex, prop) {
    var def = ARRAY_FIELD_DEFS[prop];
    var wrap = document.createElement('div');
    wrap.className = 'array-editor';

    var itemsList = document.createElement('div');
    itemsList.className = 'array-editor-list';

    function renderItems() {
      itemsList.innerHTML = '';
      if (!Array.isArray(blocks[blockIndex].props[prop])) blocks[blockIndex].props[prop] = [];
      var arr = blocks[blockIndex].props[prop];
      if (arr.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'array-editor-empty';
        empty.textContent = 'Sin elementos. Usa el botón de abajo para añadir uno.';
        itemsList.appendChild(empty);
        return;
      }
      arr.forEach(function(item, itemIdx) {
        var itemEl = document.createElement('div');
        itemEl.className = 'array-editor-item';

        var itemHeader = document.createElement('div');
        itemHeader.className = 'array-editor-item-header';
        var itemTitle = document.createElement('span');
        itemTitle.textContent = '#' + (itemIdx + 1);
        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'array-editor-remove';
        delBtn.title = 'Eliminar';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', function() {
          blocks[blockIndex].props[prop].splice(itemIdx, 1);
          renderItems();
        });
        itemHeader.appendChild(itemTitle);
        itemHeader.appendChild(delBtn);
        itemEl.appendChild(itemHeader);

        def.items.forEach(function(field) {
          var fLabel = document.createElement('label');
          fLabel.textContent = def.labels[field] || field;
          itemEl.appendChild(fLabel);

          var fInput = (field === 'description' || field === 'text')
            ? document.createElement('textarea')
            : document.createElement('input');
          fInput.value = item[field] || '';
          fInput.addEventListener('input', (function(it, f, inp) {
            return function() { it[f] = inp.value; };
          })(item, field, fInput));
          itemEl.appendChild(fInput);
        });

        itemsList.appendChild(itemEl);
      });
    }

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'array-editor-add';
    addBtn.textContent = def.addLabel;
    addBtn.addEventListener('click', function() {
      if (!Array.isArray(blocks[blockIndex].props[prop])) blocks[blockIndex].props[prop] = [];
      var newItem = {};
      def.items.forEach(function(f) { newItem[f] = ''; });
      blocks[blockIndex].props[prop].push(newItem);
      renderItems();
    });

    renderItems();
    wrap.appendChild(itemsList);
    wrap.appendChild(addBtn);
    return wrap;
  }

  // Sub-editor de slides del carrusel de productos en modo manual. A
  // diferencia de buildArrayEditor, el campo de imagen es un input file con
  // miniatura de preview (FileReader) en vez de un texto de URL: el usuario
  // sube su propia imagen en vez de escoger de productos existentes.
  function buildSlidesEditor(blockIndex) {
    var wrap = document.createElement('div');
    wrap.className = 'array-editor';

    var itemsList = document.createElement('div');
    itemsList.className = 'array-editor-list';

    function renderItems() {
      itemsList.innerHTML = '';
      if (!Array.isArray(blocks[blockIndex].props.slides)) blocks[blockIndex].props.slides = [];
      var arr = blocks[blockIndex].props.slides;
      if (arr.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'array-editor-empty';
        empty.textContent = 'Sin slides. Usa el botón de abajo para añadir uno.';
        itemsList.appendChild(empty);
        return;
      }
      arr.forEach(function(item, itemIdx) {
        var itemEl = document.createElement('div');
        itemEl.className = 'array-editor-item';

        var itemHeader = document.createElement('div');
        itemHeader.className = 'array-editor-item-header';
        var itemTitle = document.createElement('span');
        itemTitle.textContent = '#' + (itemIdx + 1);
        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'array-editor-remove';
        delBtn.title = 'Eliminar';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', function() {
          blocks[blockIndex].props.slides.splice(itemIdx, 1);
          renderItems();
        });
        itemHeader.appendChild(itemTitle);
        itemHeader.appendChild(delBtn);
        itemEl.appendChild(itemHeader);

        // Imagen: preview + input file
        var imgLabel = document.createElement('label');
        imgLabel.textContent = 'Imagen';
        itemEl.appendChild(imgLabel);

        var preview = document.createElement('img');
        var hasExistingUrl = item.image && typeof item.image === 'string';
        preview.style.cssText = 'max-width:100%;max-height:140px;border-radius:6px;object-fit:cover;margin-bottom:6px;display:' + (hasExistingUrl ? 'block' : 'none') + ';';
        if (hasExistingUrl) preview.src = item.image;
        itemEl.appendChild(preview);

        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/png,image/jpeg,image/webp';
        fileInput.addEventListener('change', (function(it, previewEl) {
          return function() {
            var file = this.files && this.files[0];
            if (!file) return;
            it.image = file; // se sube a /api/upload recién al guardar
            var reader = new FileReader();
            reader.onload = function(e) {
              previewEl.src = e.target.result;
              previewEl.style.display = 'block';
            };
            reader.readAsDataURL(file);
          };
        })(item, preview));
        itemEl.appendChild(fileInput);

        // Título
        var titleLabel = document.createElement('label');
        titleLabel.textContent = 'Título';
        itemEl.appendChild(titleLabel);
        var titleInput = document.createElement('input');
        titleInput.value = item.title || '';
        titleInput.addEventListener('input', (function(it, inp) { return function() { it.title = inp.value; }; })(item, titleInput));
        itemEl.appendChild(titleInput);

        // Descripción
        var descLabel = document.createElement('label');
        descLabel.textContent = 'Descripción';
        itemEl.appendChild(descLabel);
        var descInput = document.createElement('textarea');
        descInput.value = item.description || '';
        descInput.addEventListener('input', (function(it, inp) { return function() { it.description = inp.value; }; })(item, descInput));
        itemEl.appendChild(descInput);

        // Link
        var linkLabel = document.createElement('label');
        linkLabel.textContent = 'Link (opcional)';
        itemEl.appendChild(linkLabel);
        var linkInput = document.createElement('input');
        linkInput.value = item.link || '';
        linkInput.addEventListener('input', (function(it, inp) { return function() { it.link = inp.value; }; })(item, linkInput));
        itemEl.appendChild(linkInput);

        itemsList.appendChild(itemEl);
      });
    }

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'array-editor-add';
    addBtn.textContent = '+ Añadir Slide';
    addBtn.addEventListener('click', function() {
      if (!Array.isArray(blocks[blockIndex].props.slides)) blocks[blockIndex].props.slides = [];
      blocks[blockIndex].props.slides.push({ image: '', title: '', description: '', link: '' });
      renderItems();
    });

    renderItems();
    wrap.appendChild(itemsList);
    wrap.appendChild(addBtn);
    return wrap;
  }

  // Construir paleta de bloques
  function buildPalette() {
    els.palette.innerHTML = '';
    BLOCK_TYPES.forEach(function(bt) {
      var item = document.createElement('div');
      item.className = 'palette-item';
      item.innerHTML = '<div class="block-thumb">' + bt.thumb + '</div><div class="palette-label">' + bt.icon + ' ' + bt.label + '</div><div class="palette-desc">' + bt.desc + '</div>';
      item.addEventListener('click', function() { addBlock(bt.type); });
      els.palette.appendChild(item);
    });
  }

  // Añadir bloque al array
  function addBlock(type) {
    var def = BLOCK_TYPES.find(function(b) { return b.type === type; });
    if (!def) return;
    var newBlock = { type: type, props: {} };
    def.props.forEach(function(p) { newBlock.props[p] = ''; });
    if (type === 'cards') newBlock.props.cards = [];
    if (type === 'gallery') newBlock.props.images = [];
    if (type === 'testimonials') newBlock.props.testimonials = [];
    if (type === 'product-carousel') { newBlock.props.mode = 'category'; newBlock.props.slides = []; }
    blocks.push(newBlock);
    renderBlocks();
    expandBlock(blocks.length - 1); // auto-expandir el recién añadido
  }

  // Eliminar bloque
  function removeBlock(index) {
    blocks.splice(index, 1);
    renderBlocks();
  }

  // Mover bloque
  function moveBlock(index, dir) {
    var newIdx = index + dir;
    if (newIdx < 0 || newIdx >= blocks.length) return;
    var temp = blocks[index];
    blocks[index] = blocks[newIdx];
    blocks[newIdx] = temp;
    renderBlocks();
  }

  // Expandir/colapsar bloque
  function toggleBlock(index) {
    var blockEls = els.blockList.querySelectorAll('.editor-block');
    if (blockEls[index]) blockEls[index].classList.toggle('expanded');
  }

  function expandBlock(index) {
    var blockEls = els.blockList.querySelectorAll('.editor-block');
    if (blockEls[index]) blockEls[index].classList.add('expanded');
  }

  // Rellena el body de un bloque con sus campos de props. Se extrae de
  // renderBlocks para poder re-invocarla sola cuando cambia el modo del
  // carrusel de productos, sin reconstruir toda la lista de bloques (eso
  // perdería el estado expandido/colapsado de cada bloque, que solo vive
  // como clase CSS en el DOM y no se persiste en ninguna variable).
  function fillBlockBody(body, i, block, def) {
    body.innerHTML = '';
    if (!def || !def.props) return;
    def.props.forEach(function(prop) {
      // Visibilidad condicional del carrusel de productos según su modo
      if (block.type === 'product-carousel') {
        var mode = block.props.mode || 'category';
        if ((prop === 'category' || prop === 'max_items') && mode !== 'category') return;
        if (prop === 'slides' && mode !== 'manual') return;
      }

      var labelEl = document.createElement('label');
      labelEl.textContent = formatPropLabel(prop);
      body.appendChild(labelEl);

      if (prop === 'mode' && block.type === 'product-carousel') {
        var modeSelect = document.createElement('select');
        [['category', 'Categoría (automático)'], ['manual', 'Manual (slides personalizados)']].forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o[0];
          opt.textContent = o[1];
          modeSelect.appendChild(opt);
        });
        modeSelect.value = block.props.mode || 'category';
        modeSelect.addEventListener('change', function() {
          blocks[i].props.mode = this.value;
          fillBlockBody(body, i, blocks[i], def); // re-render solo este body
        });
        body.appendChild(modeSelect);
      } else if (prop === 'slides') {
        body.appendChild(buildSlidesEditor(i));
      } else if (ARRAY_FIELD_DEFS[prop]) {
        body.appendChild(buildArrayEditor(i, prop));
      } else if (prop === 'category') {
        var select = document.createElement('select');
        var optAll = document.createElement('option');
        optAll.value = '';
        optAll.textContent = 'Todas las categorías';
        select.appendChild(optAll);
        PRODUCT_CATEGORIES.forEach(function(cat) {
          var opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          select.appendChild(opt);
        });
        select.value = block.props[prop] || '';
        select.addEventListener('change', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
        body.appendChild(select);
      } else if (prop === 'content' || prop === 'description') {
        var ta = document.createElement('textarea');
        ta.value = block.props[prop] || '';
        ta.addEventListener('input', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
        body.appendChild(ta);
      } else {
        var input = document.createElement('input');
        input.value = block.props[prop] || '';
        input.addEventListener('input', (function(idx, p) { return function() { blocks[idx].props[p] = this.value; }; })(i, prop));
        body.appendChild(input);
      }
    });
  }

  // Renderizar lista de bloques
  function renderBlocks() {
    els.blockList.innerHTML = '';
    els.blockCount.textContent = blocks.length;
    if (blocks.length === 0) {
      els.blockList.innerHTML = '<div class="empty-state" id="emptyBlocks">No hay bloques. Selecciona uno de la paleta superior.</div>';
      return;
    }
    blocks.forEach(function(block, i) {
      var def = BLOCK_TYPES.find(function(b) { return b.type === block.type; });
      var icon = def ? def.icon : '❓';
      var label = def ? def.label : block.type;
      var summary = getBlockSummary(block);

      var div = document.createElement('div');
      div.className = 'editor-block';
      div.innerHTML = '<div class="block-header">' +
        '<span class="block-type-icon">' + icon + '</span>' +
        '<span class="block-type-name">' + label + '</span>' +
        '<span class="block-summary">' + escapeHtml(summary) + '</span>' +
        '<span class="block-actions">' +
          '<button class="move-up" title="Subir">↑</button>' +
          '<button class="move-down" title="Bajar">↓</button>' +
          '<button class="delete" title="Eliminar">✕</button>' +
        '</span>' +
      '</div>' +
      '<div class="block-body"></div>';

      // Llenar body con campos de props
      var body = div.querySelector('.block-body');
      fillBlockBody(body, i, block, def);

      // Eventos de la cabecera
      var header = div.querySelector('.block-header');
      header.addEventListener('click', function(e) {
        if (e.target.closest('button')) return; // no toggle si click en botón
        toggleBlock(i);
      });
      div.querySelector('.move-up').addEventListener('click', function(e) { e.stopPropagation(); moveBlock(i, -1); });
      div.querySelector('.move-down').addEventListener('click', function(e) { e.stopPropagation(); moveBlock(i, 1); });
      div.querySelector('.delete').addEventListener('click', function(e) { e.stopPropagation(); removeBlock(i); });

      els.blockList.appendChild(div);
    });
  }

  function getBlockSummary(block) {
    var def = BLOCK_TYPES.find(function(b) { return b.type === block.type; });
    if (!def || !def.props) return '';
    var firstProp = def.props[0];
    var val = block.props[firstProp];
    return val ? String(val).substring(0, 50) : '(sin configurar)';
  }

  var PROP_LABEL_OVERRIDES = { category: 'Categoría', mode: 'Modo', slides: 'Slides (Manual)' };
  function formatPropLabel(prop) {
    if (PROP_LABEL_OVERRIDES[prop]) return PROP_LABEL_OVERRIDES[prop];
    return prop.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
  }

  // ========== Guardar ==========
  function collectContentJson() {
    if (blocks.length === 0) return null;
    return JSON.stringify(blocks);
  }

  function uploadFile(file) {
    var formData = new FormData();
    formData.append('file', file);
    return fetch('/api/upload', {
      method: 'POST',
      body: formData
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(err) { throw new Error(err.error || 'Error al subir imagen'); });
      return r.json();
    });
  }

  // Sube las imágenes aún no subidas (Files) de los slides manuales del
  // carrusel de productos, y reemplaza cada una por la URL devuelta por R2.
  // Si slide.image ya es un string (URL existente, no se tocó), se deja igual.
  function uploadPendingSlideImages() {
    var uploads = [];
    blocks.forEach(function(block) {
      if (block.type !== 'product-carousel' || !Array.isArray(block.props.slides)) return;
      block.props.slides.forEach(function(slide) {
        if (slide.image && typeof slide.image !== 'string') {
          uploads.push(uploadFile(slide.image).then(function(result) {
            slide.image = result.url;
          }));
        }
      });
    });
    return Promise.all(uploads);
  }

  function savePage() {
    els.btnSave.disabled = true;
    els.btnSave.textContent = 'Guardando...';
    uploadPendingSlideImages().then(function() {
      var body = {
        slug: els.pageSlug.value.trim(),
        title: els.pageTitle.value.trim() || null,
        content_json: collectContentJson(),
        meta_title: els.pageMetaTitle.value.trim() || null,
        meta_description: els.pageMetaDescription.value.trim() || null,
        status: els.pageStatus.value
      };
      var url = currentId ? '/api/pages/' + currentId : '/api/pages';
      var method = currentId ? 'PUT' : 'POST';
      return fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
      return r.json();
    }).then(function() {
      hideForm();
      loadPages();
    }).catch(function(err) {
      alert('Error al guardar: ' + err.message);
    }).then(function() {
      els.btnSave.disabled = false;
      els.btnSave.textContent = '💾 Guardar';
    });
  }

  // ========== Cargar / Editar ==========
  function loadPages() {
    fetch('/api/pages?status=all')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var pages = data.pages || data;
        els.pageCount.textContent = '(' + pages.length + ' páginas)';
        renderTable(pages);
      });
  }

  function renderTable(pages) {
    els.tbody.innerHTML = '';
    pages.forEach(function(p) {
      var tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid #1e1e2e';
      tr.innerHTML =
        '<td style="padding:8px;"><code>' + escapeHtml(p.slug) + '</code></td>' +
        '<td style="padding:8px;">' + escapeHtml(p.title || '') + '</td>' +
        '<td style="padding:8px;"><span style="background:' + (p.status === 'published' ? '#1a3a1a' : '#3a3a1a') + ';color:' + (p.status === 'published' ? '#4caf50' : '#ffc107') + ';padding:2px 8px;border-radius:10px;font-size:11px;">' + escapeHtml(p.status) + '</span></td>' +
        '<td style="padding:8px;"><button class="btn-edit" data-id="' + p.id + '" style="background:none;border:1px solid #3a3a4a;color:#aaa;border-radius:4px;padding:4px 8px;cursor:pointer;margin-right:4px;">✏️</button><button class="btn-delete" data-id="' + p.id + '" style="background:none;border:1px solid #3a3a4a;color:#aaa;border-radius:4px;padding:4px 8px;cursor:pointer;">🗑️</button></td>';
      els.tbody.appendChild(tr);
    });

    mod.querySelectorAll('.btn-edit').forEach(function(btn) {
      btn.addEventListener('click', function() { editPage(this.dataset.id); });
    });
    mod.querySelectorAll('.btn-delete').forEach(function(btn) {
      btn.addEventListener('click', function() { deletePage(this.dataset.id); });
    });
  }

  function editPage(id) {
    fetch('/api/pages/' + id)
      .then(function(r) { return r.json(); })
      .then(function(page) {
        currentId = page.id;
        els.editorTitle.textContent = 'Editar: ' + (page.title || page.slug);
        els.pageSlug.value = page.slug || '';
        els.pageSlug.readOnly = true;
        els.pageTitle.value = page.title || '';
        els.pageMetaTitle.value = page.meta_title || '';
        els.pageMetaDescription.value = page.meta_description || '';
        els.pageStatus.value = page.status || 'draft';

        // Parsear content_json
        parseContentJson(page.content_json);
        els.editor.style.display = 'block';
        renderBlocks();
      });
  }

  function parseContentJson(raw) {
    blocks = [];
    if (!raw) return;
    try {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        // Nuevo formato: array de bloques
        blocks = parsed;
      } else if (typeof parsed === 'object') {
        // Formato antiguo: objeto clave-valor → convertir a bloques text
        Object.keys(parsed).forEach(function(key) {
          blocks.push({ type: 'text', props: { title: key, content: parsed[key] } });
        });
      }
    } catch(e) {
      blocks = [];
    }
  }

  function deletePage(id) {
    if (!confirm('¿Eliminar esta página?')) return;
    fetch('/api/pages/' + id, { method: 'DELETE' })
      .then(function() { loadPages(); });
  }

  function showNewForm() {
    currentId = null;
    els.editorTitle.textContent = 'Nueva Página';
    els.pageSlug.value = '';
    els.pageSlug.readOnly = false;
    els.pageTitle.value = '';
    els.pageMetaTitle.value = '';
    els.pageMetaDescription.value = '';
    els.pageStatus.value = 'draft';
    blocks = [];
    els.editor.style.display = 'block';
    renderBlocks();
  }

  function hideForm() {
    els.editor.style.display = 'none';
    currentId = null;
    blocks = [];
  }

  // Previsualizar
  function previewPage() {
    var slug = els.pageSlug.value.trim();
    if (!slug) { alert('Define un slug primero'); return; }
    window.open('/' + slug, '_blank');
  }

  // Eventos
  els.btnNew.addEventListener('click', showNewForm);
  els.btnSave.addEventListener('click', savePage);
  els.btnCancel.addEventListener('click', hideForm);
  els.btnPreview.addEventListener('click', previewPage);

  // Util
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Iniciar
  buildPalette();
  loadPages();
  loadProductCategories();
})();
</script>
