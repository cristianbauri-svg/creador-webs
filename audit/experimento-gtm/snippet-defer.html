<!-- ============================================================
  VARIANTE EXPERIMENTAL — no está en producción.
  Reemplazo propuesto para el fragmento de Google Tag Manager de
  public/index.html y public/404.html.

  Diferencias con el fragmento actual, que son solo dos:

  1. El <script> de gtm.js ya no se inserta al parsear el documento, sino
     en la primera interacción del usuario o a los 3 segundos, lo que
     ocurra antes.
  2. Nada más cambia. `dataLayer` se crea en la misma línea que antes y el
     evento `gtm.js` se empuja en el mismo momento que antes, así que el
     orden de la cola que Tag Manager procesa al cargar es idéntico.

  El identificador del contenedor, el <noscript> del <body>, las etiquetas,
  los activadores y las variables quedan intactos.
============================================================ -->
<script>(function(w,d,s,l,i){
  // La cola existe desde el primer byte: cualquier evento disparado antes de
  // que llegue el contenedor —un clic en WhatsApp, por ejemplo— se queda
  // guardado en el array y Tag Manager lo procesa en orden al cargar.
  w[l]=w[l]||[];
  w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});

  var cargado=false;
  function cargar(){
    if(cargado)return;
    cargado=true;
    desatar();
    var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
    j.async=true;
    j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
    f.parentNode.insertBefore(j,f);
  }

  // Señales de que hay una persona al otro lado. En escritorio basta mover el
  // ratón; en móvil, tocar o desplazar. Todas pasivas y en captura, para no
  // interferir con ningún manejador de la página.
  var señales=['pointerdown','pointermove','touchstart','keydown','wheel','scroll'],
      opciones={passive:true,capture:true};
  function desatar(){
    for(var k=0;k<señales.length;k++)w.removeEventListener(señales[k],cargar,opciones);
  }
  for(var k=0;k<señales.length;k++)w.addEventListener(señales[k],cargar,opciones);

  // Red de seguridad: si nadie interactúa, el contenedor carga igual.
  w.setTimeout(cargar,3000);
})(window,document,'script','dataLayer','GTM-5VQGJ3Z8');</script>
